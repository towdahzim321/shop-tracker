<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shop Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-light:#28395F;
    --amber:#F2A93B;
    --amber-dark:#B87A15;
    --bg:#F4F5F7;
    --card:#FFFFFF;
    --border:#E1E4EA;
    --text:#1A1D26;
    --text-soft:#5B6072;
    --text-faint:#9A9FAE;
    --green:#1D9E75;
    --green-bg:#E1F5EE;
    --red:#D8433C;
    --red-bg:#FBE7E6;
    --amber-bg:#FDF1DD;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    padding-bottom:40px;
  }
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
  }
  .topbar .title{font-size:17px;font-weight:600;}
  .topbar .sub{font-size:12px;color:#B9C2D8;margin-top:2px;}
  .topbar button.back{
    background:rgba(255,255,255,0.12);
    border:none;
    color:#fff;
    padding:8px 12px;
    border-radius:10px;
    font-size:14px;
    font-weight:500;
  }
  .content{padding:20px;}
  h1{font-size:22px;font-weight:700;margin:0 0 6px;}
  h2{font-size:17px;font-weight:600;margin:0 0 12px;}
  p.lead{color:var(--text-soft);font-size:14px;margin:0 0 22px;line-height:1.5;}
  .btn{
    display:block;
    width:100%;
    padding:18px 16px;
    border-radius:var(--radius);
    border:none;
    font-size:16px;
    font-weight:600;
    text-align:left;
    margin-bottom:12px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-amber{background:var(--amber);color:#3A2400;}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--border);}
  .btn-full-center{text-align:center;}
  .btn:active{transform:scale(0.98);}
  .btn-sub{display:block;font-size:12px;font-weight:400;opacity:0.75;margin-top:3px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%;
    padding:14px;
    font-size:17px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  .field textarea{min-height:90px;resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--navy);}
  .err{color:var(--red);font-size:13px;margin-top:6px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .list-item{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 14px;
    margin-bottom:9px;
    cursor:pointer;
  }
  .list-item:active{background:var(--bg);}
  .list-item .model{font-weight:600;font-size:15px;}
  .list-item .imei{font-size:12px;color:var(--text-faint);margin-top:2px;}
  .empty{color:var(--text-faint);font-size:14px;text-align:center;padding:30px 10px;}
  .success-box{
    background:var(--green-bg);
    border-radius:var(--radius);
    padding:26px 18px;
    text-align:center;
    margin-bottom:18px;
  }
  .success-box .check{font-size:36px;margin-bottom:8px;}
  .success-box .msg{color:#0E5C46;font-weight:600;font-size:16px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;}
  .stat .label{font-size:12px;color:var(--text-soft);margin-bottom:4px;}
  .stat .value{font-size:20px;font-weight:700;}
  .stat.flag-ok .value{color:var(--green);}
  .stat.flag-bad .value{color:var(--red);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:20px;
    background:#fff;
    border:1.5px solid var(--border);
    font-size:13px;
    font-weight:600;
    color:var(--text-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .alert-banner{
    background:var(--red-bg);
    color:#8E2B25;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
  }
  .warn-banner{
    background:var(--amber-bg);
    color:#7A4E0A;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
  }
  .activity-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .activity-row:last-child{border-bottom:none;}
  .activity-row .txt{color:var(--text);}
  .activity-row .time{color:var(--text-faint);white-space:nowrap;margin-left:10px;}
  table.stock-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.stock-table th{text-align:left;color:var(--text-soft);font-weight:600;padding:6px 4px;border-bottom:1.5px solid var(--border);}
  table.stock-table td{padding:8px 4px;border-bottom:1px solid var(--border);}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .chip-green{background:var(--green-bg);color:#0E5C46;}
  .chip-red{background:var(--red-bg);color:#8E2B25;}
  .chip-gray{background:#EEF0F3;color:var(--text-soft);}
  .search-box{margin-bottom:14px;}
  .keypad-dots{display:flex;justify-content:center;gap:12px;margin:20px 0;}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy);}
  .dot.filled{background:var(--navy);}
  .reason-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .reason-btn{padding:14px 8px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;text-align:center;cursor:pointer;}
  .reason-btn.selected{background:var(--navy);color:#fff;border-color:var(--navy);}
  .link-btn{background:none;border:none;color:var(--navy);font-size:13px;font-weight:600;text-decoration:underline;padding:0;cursor:pointer;font-family:inherit;}
  .footer-note{text-align:center;color:var(--text-faint);font-size:11px;margin-top:20px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,25,40,0.55);
    display:flex;align-items:center;justify-content:center;padding:22px;z-index:100;
  }
  .modal-box{
    background:#fff;border-radius:16px;padding:22px 20px;max-width:400px;width:100%;
  }
  .modal-box .modal-msg{font-size:16px;font-weight:600;line-height:1.45;margin-bottom:18px;}
  .modal-box .modal-actions{display:flex;gap:10px;}
  .modal-box .modal-actions button{
    flex:1;padding:15px 10px;border-radius:12px;border:none;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;
  }
  .modal-box .modal-actions .no{background:#EEF0F3;color:var(--text);}
  .modal-box .modal-actions .yes{background:var(--red);color:#fff;}
  .modal-box .modal-actions .yes-safe{background:var(--navy);color:#fff;}
  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .refresh-row .live{font-size:11px;color:var(--text-faint);}
  .mini-btn{
    background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:7px 14px;
    font-size:13px;font-weight:600;color:var(--navy);font-family:inherit;cursor:pointer;
  }
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .sheet-head .biz{font-size:17px;font-weight:700;letter-spacing:0.5px;}
  .sheet-head .meta{font-size:12px;color:var(--text-soft);margin-top:2px;}
  table.sheet-table{width:100%;border-collapse:collapse;font-size:12px;}
  table.sheet-table th{
    text-align:left;font-weight:700;padding:7px 5px;border:1px solid var(--border);
    background:#F0F2F6;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;
  }
  table.sheet-table td{padding:8px 5px;border:1px solid var(--border);vertical-align:top;}
  table.sheet-table td.num{text-align:center;font-weight:600;}
  table.sheet-table tr.total-row td{background:#F0F2F6;font-weight:700;}
  table.sheet-table .note{font-size:10px;color:var(--text-soft);display:block;}
  .sign-row{display:flex;gap:24px;margin-top:26px;}
  .sign-row .sign{flex:1;border-top:1px solid var(--text-faint);padding-top:5px;font-size:11px;color:var(--text-soft);}
  @media print{
    body{background:#fff;}
    #app{max-width:none;margin:0;padding:0;background:#fff;}
    .content{padding:0;}
    .no-print{display:none !important;}
    table.sheet-table{font-size:10.5px;}
    table.sheet-table th{background:#EEE !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    table.sheet-table tr.total-row td{background:#EEE !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    table.sheet-table tr{page-break-inside:avoid;}
    table.sheet-table td{height:26px;}
    @page{size:A4 portrait;margin:12mm;}
  }
  .section-flag{
    background:var(--amber-bg);color:#7A4E0A;border-radius:10px;padding:11px 13px;
    font-size:13px;font-weight:600;margin-bottom:12px;
  }
  .pickup-wrap{margin-bottom:20px;}
  .pickup-heading{
    font-size:12px;font-weight:700;color:var(--amber-dark);text-transform:uppercase;
    letter-spacing:0.5px;margin-bottom:8px;
  }
  .pickup-item{
    background:var(--amber-bg);border:1px solid #EBCE95;border-left:4px solid var(--amber);
  }
  .pickup-item .model{color:#3A2400;}
  .pickup-item .imei{color:#7A4E0A;}
  .local-mode-banner{
    background:var(--red);color:#fff;text-align:center;font-size:12.5px;font-weight:600;
    padding:10px 16px;line-height:1.4;
  }
  .save-toast{
    position:fixed;left:12px;right:12px;bottom:14px;z-index:200;max-width:456px;margin:0 auto;
  }
  .save-toast .box{
    background:var(--red);color:#fff;border-radius:12px;padding:13px 14px;font-size:13px;
    font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,0.3);display:flex;justify-content:space-between;
    align-items:center;gap:10px;
  }
  .save-toast button{
    background:rgba(255,255,255,0.18);border:none;color:#fff;padding:6px 10px;border-radius:8px;
    font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;flex:0 0 auto;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const SHOPS = [
  {id:'harare', name:'Harare CBD'},
  {id:'bulawayo1', name:'Bulawayo Shop 1'},
  {id:'bulawayo2', name:'Bulawayo Shop 2'}
];
const DEFAULT_PINS = {harare:'1234', bulawayo1:'2345', bulawayo2:'3456'};
const DEFAULT_ADMIN = {username:'owner', password:'towdah9999'};
const DEFAULT_LOW_STOCK = 3;
const AGED_FAULTY_DAYS = 3;
const UNCONFIRMED_CASH_LOOKBACK_DAYS = 7;
const RETURN_REASONS = ['Faulty','Wrong item','Changed mind','Other'];
const FAULT_PARTS = ['Screen/LCD','Battery','Camera','Charging port','Speaker/Mic','Network/Signal','Buttons','Back cover/glass','Software','Water damage','Other'];
const COMMON_MODELS = ['Samsung A15','Samsung A25','Samsung A55','Samsung S23','Samsung S24','iPhone 11','iPhone 12','iPhone 13','iPhone 14','iPhone 15'];

let CONFIG = null;
let SHOP_CACHE = {};

let S = { view:'home' };

function shopName(id){ const s = SHOPS.find(x=>x.id===id); return s ? s.name : id; }
function pad2(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ const x = d || new Date(); return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function tsDate(ts){ return dateStr(new Date(ts)); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return dateStr(d); }
function nowLabel(){ return new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function money(n){ if(n===null||n===undefined||isNaN(n)) return '-'; return '$' + Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}); }
function genId(){ return 'p' + Date.now() + Math.random().toString(36).slice(2,7); }
function genBatchId(){ return 'b' + Date.now() + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// STORAGE_MODE tracks whether we're actually on the shared link ('shared') or
// had to fall back to this single device's own storage ('local'). render()
// shows an unmissable banner whenever we're in 'local' mode.
let STORAGE_MODE = 'shared';
const LOCAL_PREFIX = 'shoptracker_local_';
function hasSharedStorage(){
  return typeof window !== 'undefined' && !!window.storage
    && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}
function localGet(key){
  try{ return localStorage.getItem(LOCAL_PREFIX + key); }catch(e){ return null; }
}
function localSet(key, val){
  try{ localStorage.setItem(LOCAL_PREFIX + key, val); return true; }catch(e){ return false; }
}
async function sget(key){
  if(hasSharedStorage()){
    try{
      const r = await window.storage.get(key, true);
      STORAGE_MODE = 'shared';
      if(r === null || r === undefined) return null;
      if(typeof r === 'string') return r;
      if(typeof r.value === 'string') return r.value;
      if(r.value === null || r.value === undefined) return null;
      return String(r.value);
    }catch(e){
      STORAGE_MODE = 'local';
      return localGet(key);
    }
  }
  STORAGE_MODE = 'local';
  return localGet(key);
}
async function sset(key, val){
  if(hasSharedStorage()){
    try{
      await window.storage.set(key, val, true);
      STORAGE_MODE = 'shared';
      return true;
    }catch(e){
      STORAGE_MODE = 'local';
      if(!localSet(key, val)) throw new Error('save-failed');
      return true;
    }
  }
  STORAGE_MODE = 'local';
  if(!localSet(key, val)) throw new Error('save-failed');
  return true;
}

async function loadConfig(){
  try{
    const raw = await sget('app_config');
    CONFIG = JSON.parse(raw);
    let changed = false;
    if(!CONFIG.admin){ CONFIG.admin = {...DEFAULT_ADMIN}; changed = true; }
    if(!CONFIG.lowStockThreshold && CONFIG.lowStockThreshold !== 0){ CONFIG.lowStockThreshold = DEFAULT_LOW_STOCK; changed = true; }
    if(!CONFIG.pins){ CONFIG.pins = {...DEFAULT_PINS}; changed = true; }
    if(changed) await saveConfig();
  }catch(e){
    CONFIG = { pins: {...DEFAULT_PINS}, admin: {...DEFAULT_ADMIN}, lowStockThreshold: DEFAULT_LOW_STOCK };
    try{ await sset('app_config', JSON.stringify(CONFIG)); }catch(e2){ /* keep going with in-memory config so the app still opens */ }
  }
}
async function saveConfig(){
  await sset('app_config', JSON.stringify(CONFIG));
}
function emptyShopData(){ return { inventory: [], dailyLogs: [], activity: [], businessDays: [], ledger: [], draftReceiving: null }; }
function normalizeShop(d){
  if(!d.inventory) d.inventory = [];
  if(!d.dailyLogs) d.dailyLogs = [];
  if(!d.activity) d.activity = [];
  if(!d.businessDays) d.businessDays = [];
  if(!d.ledger) d.ledger = [];
  if(d.draftReceiving === undefined) d.draftReceiving = null;
  return d;
}
function pushLedger(data, entry){
  if(!data.ledger) data.ledger = [];
  data.ledger.push(Object.assign({lid: genId(), ts: Date.now()}, entry));
  if(data.ledger.length > 4000) data.ledger = data.ledger.slice(-4000);
}
function getBizDay(data, date){ return (data.businessDays||[]).find(b=>b.date===date); }
function isDayOpen(data, date){ const b = getBizDay(data,date); return !!b && b.status==='open'; }
function bizDayBanner(data, shopId, date){
  const b = getBizDay(data, date);
  if(b && b.status==='open'){
    return `<div class="warn-banner" style="background:var(--green-bg);color:#0E5C46;">Business day ${esc(date)} is open (opened by ${esc(b.openedBy)}).</div>`;
  }
  if(b && b.status==='closed'){
    return `<div class="alert-banner">Business day ${esc(date)} is closed (closed by ${esc(b.closedBy||'-')}). <button class="link-btn" style="color:inherit;" onclick="openBizDayAction('${shopId}','${date}')">Reopen today</button></div>`;
  }
  return `<div class="alert-banner">Business day ${esc(date)} is not open. Staff cannot log entries until you open it. <button class="link-btn" style="color:inherit;" onclick="openBizDayAction('${shopId}','${date}')">Open today</button></div>`;
}
function reopenDay(data, date, who){
  if(!data.businessDays) data.businessDays = [];
  let b = getBizDay(data, date);
  const wasClosed = !!(b && b.status === 'closed');
  const eodExists = !!data.dailyLogs.find(l=>l.date===date);
  if(!b){ b = {date, status:'open', openedBy:who, openedAt:Date.now(), closedBy:null, closedAt:null}; data.businessDays.push(b); }
  else { b.status='open'; b.openedBy=who; b.openedAt=Date.now(); b.closedBy=null; b.closedAt=null; }
  if(wasClosed && eodExists){
    b.reopenCount = (b.reopenCount||0) + 1;
    b.lastReopenBy = who;
    b.lastReopenAt = Date.now();
    pushLedger(data, {type:'reopen', by:who, note:'Day '+date+' reopened after end of day was submitted'});
  }
  pushActivity(null, 'edit', '', data, 'Business day '+date+' '+(wasClosed?'REOPENED':'opened')+' by '+who+((wasClosed&&eodExists)?' (after end of day was already submitted)':''));
  return b;
}
async function openBizDayAction(shopId, date){
  const admin = (CONFIG.admin && CONFIG.admin.username) || 'admin';
  await mutateShop(shopId, data => reopenDay(data, date, admin));
  render();
}
async function loadShopData(shopId){
  if(SHOP_CACHE[shopId]) return SHOP_CACHE[shopId];
  return refreshShopData(shopId);
}
async function refreshShopData(shopId){
  try{
    const raw = await sget('shop_data_' + shopId);
    if(raw){ SHOP_CACHE[shopId] = normalizeShop(JSON.parse(raw)); }
    else if(!SHOP_CACHE[shopId]){ SHOP_CACHE[shopId] = emptyShopData(); }
  }catch(e){
    if(!SHOP_CACHE[shopId]) SHOP_CACHE[shopId] = emptyShopData();
  }
  return SHOP_CACHE[shopId];
}
async function saveShopData(shopId){
  await sset('shop_data_' + shopId, JSON.stringify(SHOP_CACHE[shopId]));
}
// Pulls the newest copy from shared storage immediately before applying a change,
// so two phones saving at nearly the same moment do not wipe each other's entries.
let MUTATE_QUEUE = Promise.resolve();
function mutateShop(shopId, fn){
  const run = async ()=>{
    try{
      const data = await refreshShopData(shopId);
      const result = fn(data);
      await saveShopData(shopId);
      return result;
    }catch(e){
      showSaveError("That didn't save. Please try again — if this keeps happening, tell the owner.");
      throw e;
    }
  };
  MUTATE_QUEUE = MUTATE_QUEUE.then(run, run);
  return MUTATE_QUEUE;
}
// Shown when a save genuinely fails (both shared and local storage unavailable).
// Never shown together with a success screen - callers stop (the promise
// rejects) before they reach any "Saved!" message.
function showSaveError(msg){
  const existing = document.querySelector('.save-toast');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'save-toast';
  el.innerHTML = `<div class="box"><span>${esc(msg)}</span><button onclick="this.closest('.save-toast').remove()">Dismiss</button></div>`;
  document.body.appendChild(el);
}
function pushActivity(shopId, type, text, dataObj, altText){
  const d = dataObj || SHOP_CACHE[shopId];
  if(!d) return;
  if(!d.activity) d.activity = [];
  d.activity.unshift({ts: Date.now(), type, text: (altText !== undefined ? altText : text)});
  if(d.activity.length > 200) d.activity = d.activity.slice(0,200);
}

// In-app confirmation. Native confirm() can be blocked inside embedded frames,
// which would silently turn admin corrections into no-ops.
let MODAL_RESOLVE = null;
function askConfirm(msg, yesLabel, danger){
  return new Promise(resolve=>{
    MODAL_RESOLVE = resolve;
    const el = document.createElement('div');
    el.className = 'modal-overlay';
    el.id = 'modalOverlay';
    el.innerHTML = `<div class="modal-box">
      <div class="modal-msg">${esc(msg)}</div>
      <div class="modal-actions">
        <button class="no" onclick="closeModal(false)">Cancel</button>
        <button class="${danger===false?'yes-safe':'yes'}" onclick="closeModal(true)">${esc(yesLabel||'Yes, do it')}</button>
      </div>
    </div>`;
    document.body.appendChild(el);
  });
}
function closeModal(val){
  const el = document.getElementById('modalOverlay');
  if(el) el.remove();
  const r = MODAL_RESOLVE; MODAL_RESOLVE = null;
  if(r) r(val);
}

// Live refresh: shared data can change on another phone at any moment.
const LIVE_VIEWS = ['ownerDash','staffDash','staffMenu','ownerTransactions','ownerDayReport','ownerManage','ownerCashDetail','ownerFaulty'];
let POLL_TIMER = null;
let LAST_SYNC = null;
function startPolling(){
  if(POLL_TIMER) return;
  POLL_TIMER = setInterval(()=>{ pollTick(); }, 15000);
}
async function pollTick(force){
  if(!force){
    if(LIVE_VIEWS.indexOf(S.view) === -1) return;
    if(document.getElementById('modalOverlay')) return;
    const ae = document.activeElement;
    if(ae && ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName) >= 0) return;
  }
  const ids = (S.view.indexOf('owner')===0) ? SHOPS.map(x=>x.id) : (S.shopId ? [S.shopId] : []);
  let changed = false;
  for(const id of ids){
    const before = JSON.stringify(SHOP_CACHE[id] || null);
    await refreshShopData(id);
    if(JSON.stringify(SHOP_CACHE[id]) !== before) changed = true;
  }
  LAST_SYNC = new Date();
  if(changed || force) render();
}
function syncLabel(){
  return LAST_SYNC ? 'Updated ' + LAST_SYNC.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : 'Live';
}
// Renders the "Pick up where you left off" section. Returns '' when there is
// nothing unfinished, so it never shows an empty "all done" state.
function renderPickupSection(cards){
  if(!cards || cards.length===0) return '';
  return `<div class="pickup-wrap">
    <div class="pickup-heading">Pick up where you left off</div>
    ${cards.map(c=>`
      <div class="list-item pickup-item" onclick="${c.onclick}">
        <div class="model">${esc(c.title)}</div>
        <div class="imei">${esc(c.sub)}</div>
      </div>`).join('')}
  </div>`;
}
function timeOfDay(ts){ return ts ? new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '-'; }
function daysSince(ts){ return Math.floor((Date.now()-ts)/86400000); }
function refreshRow(){
  return `<div class="refresh-row">
    <span class="live">&#9679; ${esc(syncLabel())} &middot; refreshes automatically</span>
    <button class="mini-btn" onclick="pollTick(true)">Refresh now</button>
  </div>`;
}

}
function setView(v, extra){ S = Object.assign({view:v}, extra||{}, S.keep ? {keep:S.keep} : {}); render(); }
function go(v, extra){
  const keep = {};
  ['shopId','staffName'].forEach(k=>{ if(S[k]!==undefined) keep[k]=S[k]; });

function topbar(title, sub, backView, backExtra){

// Unfinished tasks this shop's staff can jump straight back into.
function staffPickupCards(data, shopId){
  const cards = [];
  const today = todayStr();
  const bd = getBizDay(data, today);
  const dayOpen = isDayOpen(data, today);
  const eodDone = !!data.dailyLogs.find(l=>l.date===today);
  if(dayOpen && !eodDone){
    cards.push({
      title: 'Finish end of day',
      sub: 'Day opened by '+(bd?bd.openedBy:'-')+' at '+(bd?timeOfDay(bd.openedAt):'-')+'. Count phones and cash to close out today.',
      onclick: "navTo('eod')"
    });
  }
  const draft = data.draftReceiving;
  if(draft && draft.lines && draft.lines.length){
    const totalPcs = draft.lines.reduce((a,l)=>a+l.qty,0);
    cards.push({
      title: 'Finish receiving stock',
      sub: totalPcs+' phone(s) across '+draft.lines.length+' item(s) added by '+(draft.startedBy||'-')+', not saved to stock yet.',
      onclick: "navTo('receive')"
    });
  }
  return cards;
}

async function closeBizDayAction(){
  const ok = await askConfirm("Close today's business day? You will not be able to add more entries for today unless the day is opened again.", 'Yes, close the day', false);
  if(!ok) return;
  const date = todayStr();
  const who = S.staffName;
  await mutateShop(S.shopId, data => {
    const b = getBizDay(data, date);
    if(!b) return;
    b.status = 'closed';
    b.closedBy = who;
    b.closedAt = Date.now();
    b.closingStock = data.inventory.filter(p=>p.status==='in_stock').length;
    b.closingFaulty = data.inventory.filter(p=>p.status==='faulty').length;
    pushActivity(null, 'eod', '', data, who+' closed business day '+date+' ('+b.closingStock+' in stock, '+b.closingFaulty+' faulty)');
  });
  render();
}

function attachSearchFilter(inputId, listId){
  const input = document.getElementById(inputId);
  if(!input) return;
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    const items = document.querySelectorAll('#'+listId+' .list-item');
    items.forEach(it=>{
      const m = it.getAttribute('data-model')||'';

      it.style.display = (m.includes(q) || im.includes(q)) ? '' : 'none';

async function confirmSale(){
  const val = document.getElementById('priceInput').value.trim();
  const num = parseFloat(val);
  if(!val || isNaN(num) || num<=0){ document.getElementById('priceErr').innerHTML = '<div class="err">Enter a valid sale price.</div>'; return; }
  const phoneId = selectedPhone.id;
  const who = S.staffName;
  const res = await mutateShop(S.shopId, data => {
    const p = data.inventory.find(x=>x.id===phoneId);
    if(!p) return {error:'This phone is no longer on the system. Ask the owner to check.'};
    if(p.status !== 'in_stock') return {error:'This phone is no longer available for sale. Go back and pick it from the list again.'};
    p.status = 'sold';
    p.salePrice = num;
    p.soldBy = who;
    p.dateSold = todayStr();
    p.soldTs = Date.now();
    const list = p.listPrice;
    if(list && num < list){ p.belowPrice = true; p.priceShortfall = Math.round((list - num)*100)/100; }
    else { p.belowPrice = false; p.priceShortfall = 0; }
    pushLedger(data, {type:'sold', phoneId:p.id, model:p.model, description:p.description, imei:p.imei, price:num, by:who, belowPrice:!!p.belowPrice, shortfall:p.priceShortfall||0});
    pushActivity(null, 'sale', '', data, who+' sold '+p.model+' ('+p.imei+') for '+money(num));
    return {ok:true};
  });
  if(res && res.error){
    document.getElementById('priceErr').innerHTML = '<div class="err">'+esc(res.error)+'</div>';
    return;
  }
  selectedPhone = null;
  showSuccessThen('Sale recorded.', 'staffMenu');
}

async function confirmEod(){
  const count = parseInt(document.getElementById('eodCount').value.trim());
  const faultyRaw = document.getElementById('eodFaulty').value.trim();
  const faulty = faultyRaw === '' ? 0 : parseInt(faultyRaw);
  const cash = parseFloat(document.getElementById('eodCash').value.trim());
  if(isNaN(count) || count<0){ document.getElementById('eodErr').innerHTML = '<div class="err">Enter how many good phones you counted.</div>'; return; }
  if(isNaN(faulty) || faulty<0){ document.getElementById('eodErr').innerHTML = '<div class="err">Enter how many faulty phones you counted (put 0 if none).</div>'; return; }
  if(isNaN(cash) || cash<0){ document.getElementById('eodErr').innerHTML = '<div class="err">Enter the cash collected today.</div>'; return; }
  const today = todayStr();
  const who = S.staffName;
  await mutateShop(S.shopId, data => {
    const idx = data.dailyLogs.findIndex(l=>l.date===today);
    const prev = idx>=0 ? data.dailyLogs[idx] : null;
    const entry = {date:today, physicalCount:count, faultyCount:faulty, cash:cash, submittedBy:who, timestamp:Date.now()};
    if(prev){
      entry.adjustments = prev.adjustments || [];
      entry.confirmed = prev.confirmed || false;
      entry.confirmedBy = prev.confirmedBy || null;
      entry.confirmedAt = prev.confirmedAt || null;
      entry.resubmitted = (prev.resubmitted||0) + 1;
      entry.previousCounts = (prev.previousCounts||[]).concat([{physicalCount:prev.physicalCount, faultyCount:prev.faultyCount, cash:prev.cash, submittedBy:prev.submittedBy, timestamp:prev.timestamp}]);
    }
    if(idx>=0) data.dailyLogs[idx] = entry; else data.dailyLogs.push(entry);
    pushLedger(data, {type:'eod', by:who, note:'End of day: '+count+' good, '+faulty+' faulty, '+money(cash)+' cash'+(prev?' (replaced an earlier submission)':'')});
    pushActivity(null, 'eod', '', data, who+' submitted end of day: '+count+' good phones, '+faulty+' faulty, '+money(cash)+' cash'+(prev?' (RESUBMITTED)':''));
  });
  showSuccessThen('End of day submitted. Thank you!', 'staffMenu');

function shopStats(data, date){
  const soldToday = data.inventory.filter(p=>p.status==='sold' && p.dateSold===date);
  const revenue = soldToday.reduce((a,p)=>a+(p.salePrice||0),0);
  const cost = soldToday.reduce((a,p)=>a+(p.costPrice||0),0);
  const profit = revenue - cost;
  const unitsSold = soldToday.length;
  const returnsToday = data.inventory.filter(p=>p.dateReturned===date).length;
  const receivedToday = data.inventory.filter(p=>p.dateReceived===date).length;
  const systemStock = data.inventory.filter(p=>p.status==='in_stock').length;
  const systemFaulty = data.inventory.filter(p=>p.status==='faulty').length;
  const writtenOff = data.inventory.filter(p=>p.status==='written_off');
  const writtenOffCost = writtenOff.reduce((a,p)=>a+(p.costPrice||0),0);
  const belowToday = soldToday.filter(p=>p.belowPrice);
  const belowShortfall = belowToday.reduce((a,p)=>a+(p.priceShortfall||0),0);
  const log = data.dailyLogs.find(l=>l.date===date);
  const variance = log ? (log.physicalCount - systemStock) : null;
  const faultyVariance = (log && log.faultyCount !== undefined && log.faultyCount !== null) ? (log.faultyCount - systemFaulty) : null;
  const bd = getBizDay(data, date);
  const reopened = !!(bd && bd.reopenCount);
  return {revenue, cost, profit, unitsSold, returnsToday, receivedToday, systemStock, systemFaulty,
          writtenOffCount: writtenOff.length, writtenOffCost,
          belowCount: belowToday.length, belowShortfall,
          log, variance, faultyVariance, reopened};
}
function cashNet(log){ return (log.cash||0) + ((log.adjustments||[]).reduce((a,x)=>a+x.amount,0)); }
function statsForRange(data, start, end){
  const sold = data.inventory.filter(p=>p.status==='sold' && p.dateSold && p.dateSold>=start && p.dateSold<=end);
  const revenue = sold.reduce((a,p)=>a+(p.salePrice||0),0);
  const cost = sold.reduce((a,p)=>a+(p.costPrice||0),0);
  const profit = revenue - cost;
  const units = sold.length;
  const cash = data.dailyLogs.filter(l=>l.date>=start && l.date<=end).reduce((a,l)=>a+cashNet(l),0);
  const below = sold.filter(p=>p.belowPrice);
  const belowCount = below.length;
  const belowShortfall = below.reduce((a,p)=>a+(p.priceShortfall||0),0);
  return {revenue, profit, units, cash, belowCount, belowShortfall};
}
function lastNDaysRange(n){
  const end = todayStr();
  const start = daysAgoStr(n-1);
  return {start, end};
}
function allTimeStats(data){ return statsForRange(data, '0000-01-01', '9999-12-31'); }
function last7Series(data){
  const days = [];
  for(let i=6;i>=0;i--){
    const ds = daysAgoStr(i);
    const st = statsForRange(data, ds, ds);
    days.push({date: ds, revenue: st.revenue});
  }
  return days;
}

// Corrections/decisions only the admin can make, across all shops.
// Capped and windowed deliberately so this never turns into an ever-growing
// backlog of ancient history - it's a nudge, not an inbox.
function ownerPickupCards(allData){
  const cards = [];
  const nowTs = Date.now();
  const cashCutoff = daysAgoStr(UNCONFIRMED_CASH_LOOKBACK_DAYS - 1);
  SHOPS.forEach(s=>{
    const data = allData[s.id];
    const pending = getPendingBatches(data);
    if(pending.length){
      const sorted = pending.slice().sort((a,b)=>(a.dateReceived||'').localeCompare(b.dateReceived||''));
      const b = sorted[0];
      const totalPending = pending.reduce((a,x)=>a+x.count,0);
      cards.push({
        title: 'Set prices - ' + s.name,
        sub: totalPending+' phone(s) received, still waiting on Dubai/Zim pricing'+(pending.length>1?' ('+pending.length+' batches)':'')+'.',
        onclick: `navTo('ownerPricing',{mgmtShop:'${s.id}',pricingBatch:'${b.batchId}'})`
      });
    }
    const unconfirmed = (data.dailyLogs||[]).filter(l=>!l.confirmed && l.date>=cashCutoff).sort((a,b)=>b.date.localeCompare(a.date));
    unconfirmed.slice(0,2).forEach(l=>{
      cards.push({
        title: 'Confirm cash - ' + s.name,
        sub: money(l.cash)+' reported by '+(l.submittedBy||'staff')+' for '+l.date+'. Tap to review and confirm you have seen it.',
        onclick: `navTo('ownerCashDetail',{mgmtShop:'${s.id}',cashDate:'${l.date}'})`
      });
    });
    const agedFaulty = (data.inventory||[]).filter(p=>p.status==='faulty' && p.returnedTs && daysSince(p.returnedTs) >= AGED_FAULTY_DAYS);
    if(agedFaulty.length){
      const oldest = agedFaulty.slice().sort((a,b)=>(a.returnedTs||0)-(b.returnedTs||0))[0];
      cards.push({
        title: agedFaulty.length+' faulty phone(s) need a decision - '+s.name,
        sub: 'Oldest: '+oldest.model+(oldest.description?' - '+oldest.description:'')+', returned '+daysSince(oldest.returnedTs)+' day(s) ago. Repair or write off.',
        onclick: `navTo('ownerFaulty',{mgmtShop:'${s.id}'})`
      });
    }
  });
  return cards;
}

function renderStockByModel(data){
  const inStock = data.inventory.filter(p=>p.status==='in_stock');
  if(inStock.length===0) return '<div class="empty">No stock currently recorded.</div>';
  const byModel = {};
  inStock.forEach(p=>{
    const key = p.model + (p.description ? ' - ' + p.description : '');
    if(!byModel[key]) byModel[key] = {count:0, value:0, potential:0};
    byModel[key].count++;
    byModel[key].value += (p.costPrice||0);
    byModel[key].potential += ((p.listPrice||p.costPrice||0) - (p.costPrice||0));
  });
  const rows = Object.keys(byModel).sort().map(m=>`
    <tr><td>${esc(m)}</td><td>${byModel[m].count}</td><td>${money(byModel[m].value)}</td><td>${money(byModel[m].potential)}</td></tr>
  `).join('');
  return `<table class="stock-table">
    <tr><th>Model</th><th>Units</th><th>Cost value</th><th>Exp. profit</th></tr>
    ${rows}
  </table>`;
}
function renderStockByModelAll(allData){
  const byModel = {};
  SHOPS.forEach(sh=>{
    (allData[sh.id].inventory||[]).filter(p=>p.status==='in_stock').forEach(p=>{
      const key = p.model + (p.description ? ' - ' + p.description : '');
      if(!byModel[key]) byModel[key] = {total:0, perShop:{}};
      byModel[key].total++;
      byModel[key].perShop[sh.id] = (byModel[key].perShop[sh.id]||0) + 1;

// ---- Daily stock movement sheet -------------------------------------------
// Opening stock is never typed in by anyone. It is the closing running count of
// the day before, rebuilt by replaying the history log up to that moment.
function startOfDayTs(d){ return new Date(d + 'T00:00:00').getTime(); }
function endOfDayTs(d){ return new Date(d + 'T23:59:59.999').getTime(); }
function sheetKey(e){ return (e.model || 'Unknown') + (e.description ? ' - ' + e.description : ''); }
function replayState(events, untilTs){
  const st = {};
  events.filter(e=>e.ts<=untilTs).slice().sort((a,b)=>a.ts-b.ts).forEach(e=>{
    const id = e.phoneId;
    if(!id) return;
    if(!st[id]) st[id] = {model:e.model, description:e.description, place:null};
    if(e.model) st[id].model = e.model;
    if(e.description !== undefined && e.description !== null) st[id].description = e.description;
    switch(e.type){
      case 'received':    st[id].place = 'stock'; break;
      case 'sold':        st[id].place = 'sold'; break;
      case 'returned':    st[id].place = e.toFaulty ? 'faulty' : 'stock'; break;
      case 'repaired':    st[id].place = 'stock'; break;
      case 'written_off': st[id].place = 'off'; break;
      case 'undo_sale':   st[id].place = 'stock'; break;
      case 'undo_return': st[id].place = 'sold'; break;
      case 'deleted':     st[id].place = 'gone'; break;
    }
  });
  return st;
}
function countPlace(st, place){
  const m = {};
  Object.keys(st).forEach(id=>{
    const x = st[id];
    if(x.place === place){
      const k = (x.model||'Unknown') + (x.description ? ' - ' + x.description : '');
      m[k] = (m[k]||0) + 1;
    }
  });
  return m;
}
function totalOf(m){ return Object.keys(m).reduce((a,k)=>a+m[k],0); }
function buildStockSheet(shopId, date){
  const events = buildTransactionsForShop(shopId);
  const sTs = startOfDayTs(date), eTs = endOfDayTs(date);
  const openState = replayState(events, sTs - 1);
  const closeState = replayState(events, eTs);
  const open = countPlace(openState, 'stock');
  const close = countPlace(closeState, 'stock');
  const dayEvents = events.filter(e=>e.ts>=sTs && e.ts<=eTs);
  const salesQty={}, salesAmt={}, recv={}, retStock={}, retFaulty={}, rep={}, off={};
  dayEvents.forEach(e=>{
    const k = sheetKey(e);
    if(e.type==='sold'){ salesQty[k]=(salesQty[k]||0)+1; salesAmt[k]=(salesAmt[k]||0)+(e.price||0); }
    else if(e.type==='undo_sale'){ salesQty[k]=(salesQty[k]||0)-1; salesAmt[k]=(salesAmt[k]||0)-(e.price||0); }
    else if(e.type==='received'){ recv[k]=(recv[k]||0)+1; }
    else if(e.type==='returned'){ if(e.toFaulty) retFaulty[k]=(retFaulty[k]||0)+1; else retStock[k]=(retStock[k]||0)+1; }
    else if(e.type==='repaired'){ rep[k]=(rep[k]||0)+1; }
    else if(e.type==='written_off'){ off[k]=(off[k]||0)+1; }
  });
  const seen = {};
  [open, close, salesQty, recv, retStock, retFaulty, rep, off].forEach(m=>Object.keys(m).forEach(k=>{ seen[k]=true; }));
  const rows = Object.keys(seen).sort().map(k=>{
    // Goods received has its own column. Comments carry only the movements that
    // would otherwise make opening + received - sales fail to equal closing.
    const notes = [];
    if(retStock[k]) notes.push('+' + retStock[k] + ' returned to stock');
    if(rep[k]) notes.push('+' + rep[k] + ' repaired');
    if(retFaulty[k]) notes.push('-' + retFaulty[k] + ' to faulty shelf');
    if(off[k]) notes.push('-' + off[k] + ' written off');
    return {model:k, opening:open[k]||0, received:recv[k]||0, sales:salesQty[k]||0, closing:close[k]||0, amount:salesAmt[k]||0, notes:notes.join(', ')};
  }).filter(r=> r.opening || r.closing || r.sales || r.received || r.notes);
  return {
    rows,
    totals: {
      opening:  rows.reduce((a,r)=>a+r.opening,0),
      received: rows.reduce((a,r)=>a+r.received,0),
      sales:    rows.reduce((a,r)=>a+r.sales,0),
      closing:  rows.reduce((a,r)=>a+r.closing,0),
      amount:   rows.reduce((a,r)=>a+r.amount,0)
    },
    faulty: {
      opening: totalOf(countPlace(openState,'faulty')),
      closing: totalOf(countPlace(closeState,'faulty')),
      added:   totalOf(retFaulty),
      repaired:totalOf(rep),
      written: totalOf(off)
    }
  };
}

  if(!await askConfirm('Undo this sale? The phone goes back into stock and the money comes off today’s revenue.', 'Yes, undo the sale')) return;
  const shopId = S.mgmtShop;
  await mutateShop(shopId, data => {

    pushLedger(data, {type:'undo_sale', phoneId:p.id, model:p.model, description:p.description, imei:p.imei, price:p.salePrice, by:adminName(), note:'Sale undone by admin (was sold by '+(p.soldBy||'-')+' on '+(p.dateSold||'-')+')'});

// The ledger is append-only: history survives even if a phone is re-sold,
// a sale is undone, or an entry is deleted.
function buildTransactionsForShop(shopId){
  const data = SHOP_CACHE[shopId] || emptyShopData();
  const events = [];
  const covered = new Set();
  (data.ledger||[]).forEach(l=>{
    covered.add((l.phoneId||'') + '|' + l.type);
    events.push(Object.assign({}, l, {shopId}));
  });
  // Records created before the ledger existed still show up.
  data.inventory.forEach(p=>{
    if(p.receivedTs && !covered.has(p.id+'|received')) events.push({type:'received', ts:p.receivedTs, model:p.model, description:p.description, imei:p.imei, shopId, phoneId:p.id});
    if(p.soldTs && !covered.has(p.id+'|sold')) events.push({type:'sold', ts:p.soldTs, model:p.model, description:p.description, imei:p.imei, price:p.salePrice, shopId, phoneId:p.id, belowPrice:p.belowPrice, shortfall:p.priceShortfall});
    if(p.returnedTs && !covered.has(p.id+'|returned')) events.push({type:'returned', ts:p.returnedTs, model:p.model, description:p.description, imei:p.imei, reason:p.returnReason, faultParts:p.faultParts, shopId, phoneId:p.id});
  });
  return events;
}
const CORE_TX_TYPES = ['sold','returned','received'];
const TX_LABELS = {sold:'Sold', returned:'Returned', received:'Received', repaired:'Repaired', written_off:'Written off',
  undo_sale:'Sale undone', undo_return:'Return undone', deleted:'Entry deleted', deleted_eod:'Day log deleted',
  price_set:'Prices set', cash_confirmed:'Cash confirmed', cash_adjustment:'Cash adjusted', eod:'End of day', reopen:'Day reopened'};
function txChipClass(t){
  if(t==='sold') return 'chip-red';
  if(t==='received' || t==='repaired') return 'chip-green';
  return 'chip-gray';
}
function buildTransactions(shopKey){
  let events = [];
  if(shopKey==='all'){
    SHOPS.forEach(s=>{ events = events.concat(buildTransactionsForShop(s.id)); });
  } else {
    events = buildTransactionsForShop(shopKey);
  }
  events.sort((a,b)=>b.ts-a.ts);
  return events;
}
function typeLabel(t){ return TX_LABELS[t] || t; }

async function addCashAdjustment(date){
  const amtRaw = document.getElementById('adjAmount').value.trim();
  const reason = document.getElementById('adjReason').value.trim();
  const amt = parseFloat(amtRaw);
  if(isNaN(amt) || amt===0){ document.getElementById('adjErr').innerHTML = '<div class="err">Enter a non-zero amount.</div>'; return; }
  if(!reason){ document.getElementById('adjErr').innerHTML = '<div class="err">Enter a reason for this adjustment.</div>'; return; }
  await mutateShop(S.mgmtShop, data => {
    const log = data.dailyLogs.find(l=>l.date===date);
    if(!log) return;
    if(!log.adjustments) log.adjustments = [];
    log.adjustments.push({amount:amt, reason, ts:Date.now(), by:adminName()});
    pushLedger(data, {type:'cash_adjustment', by:adminName(), price:amt, note:'Cash adjustment on '+date+': '+(amt>=0?'+':'')+money(amt)+' - '+reason});
    pushActivity(null, 'edit', '', data, 'Cash adjustment on '+date+': '+(amt>=0?'+':'')+money(amt)+' - '+reason);
  });
  render();
}

function getPendingBatches(data){
  const map = {};
  data.inventory.forEach(p=>{
    if((p.costPrice===null || p.costPrice===undefined) && p.batchId){
      if(!map[p.batchId]) map[p.batchId] = {batchId:p.batchId, model:p.model, description:p.description, count:0, dateReceived:p.dateReceived};
      map[p.batchId].count++;
    }
  });
  return Object.values(map);
}
function getPricedBatches(data){
  const map = {};
  data.inventory.forEach(p=>{
    if(p.costPrice !== null && p.costPrice !== undefined && p.batchId){
      if(!map[p.batchId]) map[p.batchId] = {batchId:p.batchId, model:p.model, description:p.description, count:0, dateReceived:p.dateReceived, costPrice:p.costPrice, listPrice:p.listPrice};
      map[p.batchId].count++;
    }
  });
  return Object.values(map).sort((a,b)=>(b.dateReceived||'').localeCompare(a.dateReceived||''));
}

async function savePricingBatch(batchId){
  const dubai = parseFloat(document.getElementById('priceDubai').value.trim());
  const zim = parseFloat(document.getElementById('priceZim').value.trim());
  if(isNaN(dubai) || dubai<=0){ document.getElementById('priceErr').innerHTML = '<div class="err">Enter the Dubai price.</div>'; return; }
  if(isNaN(zim) || zim<=0){ document.getElementById('priceErr').innerHTML = '<div class="err">Enter the Zim price.</div>'; return; }
  await mutateShop(S.mgmtShop, data => {
    let count = 0;
    let model = '';
    data.inventory.forEach(p=>{
      if(p.batchId===batchId){
        p.costPrice=dubai; p.listPrice=zim; count++; model = p.model;
        if(p.status==='sold' && p.salePrice!==null && p.salePrice!==undefined){
          if(p.salePrice < zim){ p.belowPrice = true; p.priceShortfall = Math.round((zim - p.salePrice)*100)/100; }
          else { p.belowPrice = false; p.priceShortfall = 0; }
        }
      }
    });
    pushLedger(data, {type:'price_set', by:adminName(), batchId:batchId, model:model, note:'Prices set for '+count+' phone(s): Dubai '+money(dubai)+' / Zim '+money(zim)});
    pushActivity(null, 'edit', '', data, 'Admin set pricing for '+count+' phone(s) ('+money(dubai)+' / '+money(zim)+')');
  });
  S.pricingBatch = null;
  render();
}

function screenOwnerDayReport(){
  const shopId = S.mgmtShop;
  const data = SHOP_CACHE[shopId] || emptyShopData();
  const date = S.reportDate || todayStr();
  const log = data.dailyLogs.find(l=>l.date===date);
  const events = buildTransactionsForShop(shopId).filter(e => tsDate(e.ts)===date);
  const st = shopStats(data, date);
  const soldOnDate = data.inventory.filter(p=>p.status==='sold' && p.dateSold===date);
  const returned = data.inventory.filter(p=>p.dateReturned===date);
  const received = data.inventory.filter(p=>p.dateReceived===date);
  const sold = soldOnDate;
  const revenue = st.revenue;
  const isToday = date === todayStr();
  // Closing stock is simply the live running count at the moment the day was closed.
  // It carries straight into the next day - there is no separate opening stock step.
  const bd = getBizDay(data, date);
  const hasClose = !!(bd && bd.status === 'closed' && bd.closingStock !== undefined && bd.closingStock !== null);
  const closeVar = (hasClose && log) ? (log.physicalCount - bd.closingStock) : null;
  const closeFaultyVar = (hasClose && log && log.faultyCount !== undefined && log.faultyCount !== null && bd.closingFaulty !== undefined && bd.closingFaulty !== null) ? (log.faultyCount - bd.closingFaulty) : null;
  return `
  ${topbar('Reports by date', shopName(shopId), true)}
  <div class="content">
    <div class="field">
      <label>Choose a date</label>
      <input type="date" id="reportDateInput" value="${esc(date)}" onchange="setReportDate(this.value)">
    </div>
    ${bizDayBanner(data, shopId, date)}
    <div class="stat-grid">
      <div class="stat"><div class="label">Units sold</div><div class="value">${sold.length}</div></div>
      <div class="stat"><div class="label">Revenue</div><div class="value">${money(revenue)}</div></div>
      <div class="stat"><div class="label">Profit</div><div class="value">${money(st.profit)}</div></div>
      <div class="stat"><div class="label">Returns</div><div class="value">${returned.length}</div></div>
      <div class="stat"><div class="label">Received</div><div class="value">${received.length}</div></div>
      <div class="stat"><div class="label">Cash collected</div><div class="value">${log ? money(cashNet(log)) : 'Not submitted'}</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat ${isToday && st.variance!==null ? (st.variance===0?'flag-ok':'flag-bad') : ''}"><div class="label">Good phones counted</div><div class="value">${log ? log.physicalCount : 'Not submitted'}</div></div>
      <div class="stat ${isToday && st.faultyVariance!==null ? (st.faultyVariance===0?'flag-ok':'flag-bad') : ''}"><div class="label">Faulty phones counted</div><div class="value">${log && log.faultyCount!==undefined && log.faultyCount!==null ? log.faultyCount : 'Not submitted'}</div></div>
    </div>
    ${hasClose ? `
    <div class="stat-grid">
      <div class="stat ${closeVar===null?'':(closeVar===0?'flag-ok':'flag-bad')}"><div class="label">Stock at close (system)</div><div class="value">${bd.closingStock}</div></div>
      <div class="stat ${closeFaultyVar===null?'':(closeFaultyVar===0?'flag-ok':'flag-bad')}"><div class="label">Faulty at close (system)</div><div class="value">${bd.closingFaulty!==undefined&&bd.closingFaulty!==null?bd.closingFaulty:'-'}</div></div>
    </div>
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:14px;">Closed by ${esc(bd.closedBy||'-')} at ${bd.closedAt?new Date(bd.closedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'-'}. This is the running count the shop carries into the next day - there is no opening stock to enter.</div>
    ${closeVar!==null && closeVar!==0 ? `<div class="alert-banner">On this day the shop counted ${closeVar>0?'+':''}${closeVar} against what the system had at close.</div>` : ''}
    ${closeFaultyVar!==null && closeFaultyVar!==0 ? `<div class="alert-banner">Faulty shelf was out by ${closeFaultyVar>0?'+':''}${closeFaultyVar} at close.</div>` : ''}
    ` : ''}
    ${isToday && st.variance!==null && st.variance!==0 ? `<div class="alert-banner">Stock mismatch of ${st.variance>0?'+':''}${st.variance} against the system count right now.</div>` : ''}
    ${log && log.resubmitted ? `<div class="section-flag">This end of day was submitted ${log.resubmitted+1} times. Last by ${esc(log.submittedBy||'-')}.</div>` : ''}
    ${st.belowCount>0 ? `<div class="section-flag">${st.belowCount} sale(s) below your set price on this date - ${money(st.belowShortfall)} short.</div>` : ''}
    <h2>Transactions on this date</h2>
    <div class="card">
      ${events.length===0 ? '<div class="empty">No transactions on this date.</div>' : events.map(e=>`
        <div class="activity-row">
          <div class="txt"><span class="chip ${e.type==='sold'?'chip-red':(e.type==='returned'?'chip-gray':'chip-green')}">${typeLabel(e.type)}</span> ${esc(e.model)}${e.description?' - '+esc(e.description):''} &middot; IMEI ${esc(e.imei)}${e.price?' &middot; '+money(e.price):''}${e.faultParts&&e.faultParts.length?' &middot; faults: '+esc(e.faultParts.join(', ')):''}</div>
          <div class="time">${new Date(e.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}
function setReportDate(val){ S.reportDate = val; render(); }

async function saveSettings(){
  const newPins = {};
  for(const s of SHOPS){
    const v = document.getElementById('pinset_'+s.id).value.trim();
    if(!v || v.length<4){ document.getElementById('settingsErr').innerHTML = '<div class="err">Each shop code needs at least 4 digits.</div>'; return; }
    newPins[s.id] = v;
  }
  const username = document.getElementById('adminUserSet').value.trim();
  const password = document.getElementById('adminPassSet').value;
  const threshold = parseInt(document.getElementById('lowStockSet').value.trim());
  if(!username){ document.getElementById('settingsErr').innerHTML = '<div class="err">Enter an admin username.</div>'; return; }
  if(!password || password.length<4){ document.getElementById('settingsErr').innerHTML = '<div class="err">Admin password needs at least 4 characters.</div>'; return; }
  if(isNaN(threshold) || threshold<0){ document.getElementById('settingsErr').innerHTML = '<div class="err">Enter a valid low stock number.</div>'; return; }
  CONFIG.pins = newPins;
  CONFIG.admin = {username, password};
  CONFIG.lowStockThreshold = threshold;
  await saveConfig();
  showSuccessThenGeneric('Settings updated.', 'ownerDash');
}
function showSuccessThenGeneric(msg, nextView){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${topbar('Admin dashboard','',false)}
    <div class="content">
      <div class="success-box"><div class="check">&#10003;</div><div class="msg">${esc(msg)}</div></div>
      <button class="btn btn-primary btn-full-center" onclick="go('${nextView}')">Continue</button>
    </div>`;
}

async function init(){
  document.getElementById('app').innerHTML = `<div class="content"><p class="lead">Loading...</p></div>`;
  try{
    await loadConfig();
  }catch(e){
    // Last-resort safety net: the app must never sit on "Loading..." forever.
    CONFIG = { pins: {...DEFAULT_PINS}, admin: {...DEFAULT_ADMIN}, lowStockThreshold: DEFAULT_LOW_STOCK };
  }
  render();
  startPolling();
}
init();
</script>
