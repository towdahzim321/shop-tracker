<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shop Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-light:#28395F;
    --amber:#F2A93B;
    --amber-dark:#B87A15;
    --bg:#F4F5F7;
    --card:#FFFFFF;
    --border:#E1E4EA;
    --text:#1A1D26;
    --text-soft:#5B6072;
    --text-faint:#9A9FAE;
    --green:#1D9E75;
    --green-bg:#E1F5EE;
    --red:#D8433C;
    --red-bg:#FBE7E6;
    --amber-bg:#FDF1DD;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    /* Hard backstop: wide content must scroll inside its own .table-scroll
       frame, never the page. If something is ever missed, this keeps the
       page itself from scrolling sideways rather than silently allowing it. */
    overflow-x:hidden;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    padding-bottom:40px;
  }
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
  }
  .topbar .title{font-size:17px;font-weight:600;}
  .topbar .sub{font-size:12px;color:#B9C2D8;margin-top:2px;}
  .topbar button.back{
    background:rgba(255,255,255,0.12);
    border:none;
    color:#fff;
    padding:8px 12px;
    border-radius:10px;
    font-size:14px;
    font-weight:500;
  }
  .content{padding:20px;}
  h1{font-size:22px;font-weight:700;margin:0 0 6px;}
  h2{font-size:17px;font-weight:600;margin:0 0 12px;}
  p.lead{color:var(--text-soft);font-size:14px;margin:0 0 22px;line-height:1.5;}
  .btn{
    display:block;
    width:100%;
    padding:18px 16px;
    border-radius:var(--radius);
    border:none;
    font-size:16px;
    font-weight:600;
    text-align:left;
    margin-bottom:12px;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-amber{background:var(--amber);color:#3A2400;}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--border);}
  .btn-full-center{text-align:center;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn-sub{display:block;font-size:12px;font-weight:400;opacity:0.75;margin-top:3px;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%;
    padding:14px;
    font-size:17px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-family:inherit;
    background:#fff;
    color:var(--text);
  }
  .field textarea{min-height:90px;resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--navy);}
  .err{color:var(--red);font-size:13px;margin-top:6px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .list-item{
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 14px;
    margin-bottom:9px;
    cursor:pointer;
  }
  .list-item:active{background:var(--bg);}
  .list-item .model{font-weight:600;font-size:15px;overflow-wrap:anywhere;}
  .list-item .imei{font-size:12px;color:var(--text-faint);margin-top:2px;overflow-wrap:anywhere;}
  .empty{color:var(--text-faint);font-size:14px;text-align:center;padding:30px 10px;}
  .success-box{
    background:var(--green-bg);
    border-radius:var(--radius);
    padding:26px 18px;
    text-align:center;
    margin-bottom:18px;
  }
  .success-box .check{font-size:36px;margin-bottom:8px;}
  .success-box .msg{color:#0E5C46;font-weight:600;font-size:16px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;}
  .stat .label{font-size:12px;color:var(--text-soft);margin-bottom:4px;}
  .stat .value{font-size:20px;font-weight:700;}
  .stat.flag-ok .value{color:var(--green);}
  .stat.flag-bad .value{color:var(--red);}
  .tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:20px;
    background:#fff;
    border:1.5px solid var(--border);
    font-size:13px;
    font-weight:600;
    color:var(--text-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .alert-banner{
    background:var(--red-bg);
    color:#8E2B25;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
  }
  .warn-banner{
    background:var(--amber-bg);
    color:#7A4E0A;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
  }
  .activity-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .activity-row:last-child{border-bottom:none;}
  .activity-row .txt{color:var(--text);overflow-wrap:anywhere;min-width:0;}
  .activity-row .time{color:var(--text-faint);white-space:nowrap;margin-left:10px;flex:0 0 auto;}
  /* Wide tables scroll inside their own frame instead of forcing the page
     body wider. The frame gets a fade at the right edge, shown only while
     there is actually more to scroll to (toggled by updateTableFades()
     after every render - see the JS below). Text is never shrunk to fit;
     the frame scrolls instead. Printing turns this off entirely - see the
     @media print block, where the real table just prints at full width. */
  .table-scroll{
    position:relative;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    border-radius:10px;
    background:var(--card);
  }
  .table-scroll::after{
    content:'';
    position:absolute;top:0;right:0;bottom:0;width:26px;
    background:linear-gradient(to right, transparent, var(--card) 78%);
    pointer-events:none;opacity:0;transition:opacity .15s;
  }
  .table-scroll.has-overflow::after{opacity:1;}
  table.stock-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;table-layout:auto;}
  table.stock-table th{text-align:left;color:var(--text-soft);font-weight:600;padding:6px 4px;border-bottom:1.5px solid var(--border);white-space:nowrap;}
  table.stock-table td{padding:8px 4px;border-bottom:1px solid var(--border);overflow-wrap:anywhere;}
  table.stock-table tr.total-row td{background:#F0F2F6;font-weight:700;}
  .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .chip-green{background:var(--green-bg);color:#0E5C46;}
  .chip-red{background:var(--red-bg);color:#8E2B25;}
  .chip-gray{background:#EEF0F3;color:var(--text-soft);}
  .search-box{margin-bottom:14px;}
  .keypad-dots{display:flex;justify-content:center;gap:12px;margin:20px 0;}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy);}
  .dot.filled{background:var(--navy);}
  .reason-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .reason-btn{padding:14px 8px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;text-align:center;cursor:pointer;overflow-wrap:anywhere;min-width:0;}
  .reason-btn.selected{background:var(--navy);color:#fff;border-color:var(--navy);}
  .link-btn{background:none;border:none;color:var(--navy);font-size:13px;font-weight:600;text-decoration:underline;padding:0;cursor:pointer;font-family:inherit;}
  .footer-note{text-align:center;color:var(--text-faint);font-size:11px;margin-top:20px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,25,40,0.55);
    display:flex;align-items:center;justify-content:center;padding:22px;z-index:100;
  }
  .modal-box{
    background:#fff;border-radius:16px;padding:22px 20px;max-width:400px;width:100%;
    box-sizing:border-box;overflow-wrap:anywhere;
  }
  .modal-box .modal-msg{font-size:16px;font-weight:600;line-height:1.45;margin-bottom:18px;overflow-wrap:anywhere;}
  .modal-box .modal-actions{display:flex;gap:10px;}
  .modal-box .modal-actions button{
    flex:1;padding:15px 10px;border-radius:12px;border:none;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;
  }
  .modal-box .modal-actions .no{background:#EEF0F3;color:var(--text);}
  .modal-box .modal-actions .yes{background:var(--red);color:#fff;}
  .modal-box .modal-actions .yes-safe{background:var(--navy);color:#fff;}
  .refresh-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .refresh-row .live{font-size:11px;color:var(--text-faint);}
  .mini-btn{
    background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:7px 14px;
    font-size:13px;font-weight:600;color:var(--navy);font-family:inherit;cursor:pointer;
  }
  .offline-strip{
    background:#8E2B25;color:#fff;padding:11px 14px;font-size:12.5px;font-weight:600;line-height:1.45;
  }
  .save-error-strip{
    background:var(--red);color:#fff;padding:11px 14px;font-size:12.5px;font-weight:600;line-height:1.45;
    display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
  }
  .save-error-strip button{
    background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:8px;
    padding:5px 10px;font-size:12px;font-weight:600;font-family:inherit;flex:0 0 auto;cursor:pointer;
  }
  .fatal-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 18px;margin:20px;}
  .fatal-box h1{font-size:19px;margin-bottom:10px;}
  .fatal-box p{font-size:14px;color:var(--text-soft);line-height:1.55;margin:0 0 14px;}
  .fatal-box code{font-size:11px;color:var(--text-faint);word-break:break-all;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .sheet-head .biz{font-size:17px;font-weight:700;letter-spacing:0.5px;}
  .sheet-head .meta{font-size:12px;color:var(--text-soft);margin-top:2px;}
  table.sheet-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;table-layout:auto;}
  table.sheet-table th{
    text-align:left;font-weight:700;padding:7px 5px;border:1px solid var(--border);
    background:#F0F2F6;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;
  }
  table.sheet-table td{padding:8px 5px;border:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere;}
  table.sheet-table td.num{text-align:center;font-weight:600;white-space:nowrap;}
  table.sheet-table tr.total-row td{background:#F0F2F6;font-weight:700;}
  table.sheet-table .note{font-size:10px;color:var(--text-soft);display:block;}
  .sign-row{display:flex;gap:24px;margin-top:26px;}
  .sign-row .sign{flex:1;border-top:1px solid var(--text-faint);padding-top:5px;font-size:11px;color:var(--text-soft);}
  .print-only{display:none;}
  @media print{
    body{background:#fff;}
    #app{max-width:none;margin:0;padding:0;background:#fff;}
    .content{padding:0;}
    .no-print{display:none !important;}
    .print-only{display:block;}
    .topbar .back{display:none !important;}
    .refresh-row{display:none !important;}
    table.sheet-table{font-size:10.5px;}
    table.sheet-table th{background:#EEE !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    table.sheet-table tr.total-row td{background:#EEE !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    table.sheet-table tr{page-break-inside:avoid;}
    table.sheet-table td{height:26px;}
    table.stock-table{font-size:11px;}
    table.stock-table tr.total-row td{background:#EEE !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    /* On paper every column shows at full width, same as before this fix -
       the scroll frame and its fade are a screen-only affordance. */
    .table-scroll{overflow:visible !important;}
    .table-scroll::after{display:none !important;}
    .card{border:1px solid #ccc;-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-inside:avoid;}
    .warn-banner,.section-flag,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    h2{page-break-after:avoid;}
    @page{size:A4 portrait;margin:12mm;}
  }
  .section-flag{
    background:var(--amber-bg);color:#7A4E0A;border-radius:10px;padding:11px 13px;
    font-size:13px;font-weight:600;margin-bottom:12px;
  }
  .menu-btn{
    background:rgba(255,255,255,0.12);border:none;color:#fff;padding:8px 10px;border-radius:10px;
    font-size:16px;line-height:1;cursor:pointer;flex:0 0 auto;
  }
  .menu-overlay{
    position:fixed;inset:0;background:rgba(20,25,40,0.5);z-index:90;display:flex;
  }
  .menu-panel{
    background:#fff;width:78%;max-width:300px;height:100%;overflow-y:auto;
    box-shadow:2px 0 18px rgba(0,0,0,0.25);padding:18px 16px;
  }
  .menu-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .menu-close{
    background:#EEF0F3;border:none;color:var(--text);width:32px;height:32px;border-radius:50%;
    font-size:14px;cursor:pointer;flex:0 0 auto;
  }
  .menu-group-title{
    font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;
    margin:18px 0 8px;
  }
  .menu-row{
    padding:12px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text);
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  }
  .menu-row:active{background:var(--bg);}
  .menu-row.current{background:var(--green-bg);color:#0E5C46;}
  .menu-tick{color:var(--green);font-weight:700;}
</style>

<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// SHOPS and MODEL_LIST are loaded from the database at startup (see
// loadShopsAndModels below) so the owner can add a shop or a model without
// anyone editing this file. These hardcoded arrays are ONLY the offline
// fallback - used if the database can't be reached, so the app still works
// with the shops/models known at the time this file was last updated.
const SHOPS_FALLBACK = [
  {id:'harare', name:'Harare CBD', active:true, sortOrder:1},
  {id:'bulawayo1', name:'Bulawayo Shop 1', active:true, sortOrder:2},
  {id:'bulawayo2', name:'Bulawayo Shop 2', active:true, sortOrder:3}
];
let SHOPS = SHOPS_FALLBACK.slice();
const SUPABASE_URL = 'https://fyizncdfxjfmenudcfds.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RgCpLFTYc2IMZbbaoEy2LA_SsQ0heGc';
const DEFAULT_LOW_STOCK = 3;
const RETURN_REASONS = ['Faulty','Wrong item','Changed mind','Other'];
const FAULT_PARTS = ['Screen/LCD','Battery','Camera','Charging port','Speaker/Mic','Network/Signal','Buttons','Back cover/glass','Software','Water damage','Other'];
// Same offline-fallback idea as SHOPS_FALLBACK above, grouped by brand the
// way the picker has always displayed it. MODEL_LIST (below) is the live,
// flat, database-backed list actually used once loaded.
const MODEL_CATALOG_FALLBACK = {
  'Samsung': ['Galaxy A04','Galaxy A05','Galaxy A05s','Galaxy A06','Galaxy A14','Galaxy A15','Galaxy A16',
    'Galaxy A24','Galaxy A25','Galaxy A26','Galaxy A34','Galaxy A35','Galaxy A36','Galaxy A54','Galaxy A55','Galaxy A56',
    'Galaxy S20','Galaxy S20 Ultra','Galaxy S21','Galaxy S21 Ultra','Galaxy S22','Galaxy S22 Ultra',
    'Galaxy S23','Galaxy S23 Ultra','Galaxy S24','Galaxy S24 Ultra','Galaxy S25','Galaxy S25 Ultra',
    'Galaxy Note 10','Galaxy Note 20','Galaxy Note 20 Ultra',
    'Galaxy Z Flip 4','Galaxy Z Flip 5','Galaxy Z Flip 6','Galaxy Z Fold 4','Galaxy Z Fold 5','Galaxy Z Fold 6'],
  'iPhone': ['iPhone 7','iPhone 8','iPhone X','iPhone XR','iPhone XS','iPhone XS Max',
    'iPhone 11','iPhone 11 Pro','iPhone 11 Pro Max',
    'iPhone 12','iPhone 12 Mini','iPhone 12 Pro','iPhone 12 Pro Max',
    'iPhone 13','iPhone 13 Mini','iPhone 13 Pro','iPhone 13 Pro Max',
    'iPhone 14','iPhone 14 Plus','iPhone 14 Pro','iPhone 14 Pro Max',
    'iPhone 15','iPhone 15 Plus','iPhone 15 Pro','iPhone 15 Pro Max',
    'iPhone 16','iPhone 16 Plus','iPhone 16 Pro','iPhone 16 Pro Max',
    'iPhone SE']
};
// Flat list mirroring the `models` table: {id, name, nameKey, brand, active,
// createdAt}. Starts pre-filled from the fallback catalog (no id/createdAt,
// so "Recently added" naturally has nothing to show until real data loads)
// and is replaced wholesale once loadShopsAndModels() succeeds.
let MODEL_LIST = Object.keys(MODEL_CATALOG_FALLBACK).flatMap(brand =>
  MODEL_CATALOG_FALLBACK[brand].map(name => ({id:null, name, nameKey: cleanModelKey(name), brand, active:true, createdAt:null}))
);
// Mirrors the SQL clean_model_key() function exactly - trimmed, inner
// whitespace collapsed, lowercased - so a client-side near-match check lines
// up with what the database will actually compare.
function cleanModelKey(s){ return String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase(); }
function levenshtein(a, b){
  if(a===b) return 0;
  const la=a.length, lb=b.length;
  if(la===0) return lb;
  if(lb===0) return la;
  let prev = Array.from({length:lb+1}, (_,i)=>i);
  for(let i=1;i<=la;i++){
    const cur = [i];
    for(let j=1;j<=lb;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    prev = cur;
  }
  return prev[lb];
}
// Deliberately conservative: phone model names commonly differ by a single
// digit (A15 vs A55) and those are genuinely different models, not typos, so
// this only flags very close spelling variants. A wrong suggestion costs one
// tap to dismiss - the goal is catching "iPhone14"/"Iphone 14"-style slips,
// not second-guessing every real model name.
function findNearMatchModel(typedName){
  const key = cleanModelKey(typedName);
  if(!key || key.length < 4) return null;
  const candidates = MODEL_LIST.filter(m=>m.active !== false);
  if(candidates.some(m=>m.nameKey===key)) return null;
  let best = null, bestDist = Infinity;
  candidates.forEach(m=>{
    const dist = levenshtein(key, m.nameKey);
    if(dist < bestDist){ bestDist = dist; best = m; }
  });
  const threshold = key.length >= 10 ? 2 : 1;
  return (best && bestDist > 0 && bestDist <= threshold) ? best : null;
}

// `sb` is the one door into the shared database. In real use it is the real
// Supabase client; automated tests inject window.__SB_OVERRIDE__ before this
// script runs so nothing here ever needs to touch the internet or the
// owner's real data to be tested.
let sb = null;
let CONFIG = { lowStockThreshold: DEFAULT_LOW_STOCK };
let SHOP_CACHE = {};
let MENU_OPEN = false;           // slide-over menu panel, independent of S/view
let ADMIN_SESSION = null;        // {userId, username} once signed in as admin
let STAFF_LIST_CACHE = {};       // shopId -> [{id,name}]
let STAFF_NAME_INDEX = {};       // staffId -> name, built up as staff lists load
let LAST_SYNC_AT = {};           // shopId -> Date of the last successful refresh

let S = { view:'home' };

function shopName(id){ const s = SHOPS.find(x=>x.id===id); return s ? s.name : id; }
function pad2(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ const x = d || new Date(); return x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function tsDate(ts){ return dateStr(new Date(ts)); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return dateStr(d); }
function nowLabel(){ return new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function money(n){ if(n===null||n===undefined||isNaN(n)) return '-'; return '$' + Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}); }
function genId(){ return 'p' + Date.now() + Math.random().toString(36).slice(2,7); }
function genBatchId(){ return 'b' + Date.now() + Math.random().toString(36).slice(2,7); }
function genUuid(){
  if(typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Locks a submit button the instant a real save attempt starts, so a second
// tap while the first is still in flight can't fire a second request. Only
// the code path that gets a definite reply (success or a real error) calls
// unlockBtn - a hung request with no reply at all just leaves the button
// locked, which is deliberate, not a bug to fix later.
function lockBtnSaving(id){
  const btn = document.getElementById(id);
  if(!btn) return null;

// ---- Talking to Supabase --------------------------------------------------
// One narrow door in: callRpc() for every write, refreshShopData() for every
// read. Business-rule refusals (like "the day isn't open") come back as
// clear messages already written for a shop-floor audience; anything else
// is treated as "can't reach the database right now."
//
// Nothing used to bound how long an RPC call could hang - confirmed live
// that a request Chromium never responds to at all just sits there with no
// signal, past 15s and presumably indefinitely. RPC_TIMEOUT_MS closes that:
// past this long with no reply, callRpc gives up waiting and classifies it
// the same as a network failure, rather than leaving the caller (and the
// button) stuck forever.
const RPC_TIMEOUT_MS = 20000;
async function callRpc(name, params){
  if(!sb){
    SB_UNREACHABLE = true;
    SAVE_ERROR = "THAT ENTRY MAY NOT BE SAVED. The app could not reach the shared database. Check your internet and try again.";
    return { ok:false, error: SAVE_ERROR, noReply: true };
  }
  try{
    // sb.rpc() never actually throws on a network failure - confirmed live
    // across connection-refused, DNS failure, connection reset, and a
    // silent hang: it always resolves with a Postgrest-shaped
    // {data:null, error:{message,details,hint,code}}, just with code set
    // to '' and message set to the raw "TypeError: Failed to fetch". A
    // real server reply (success or a genuine business refusal) always
    // carries a real, non-empty code. The timeout branch below resolves
    // with that exact same empty-code shape on purpose, so classification
    // afterward doesn't need to know which of the two actually happened -
    // "no code" always means "no real reply ever arrived."
    const { data, error } = await Promise.race([
      sb.rpc(name, params),
      new Promise(resolve => setTimeout(() => resolve({
        data: null,
        error: { message: 'Request timed out', details: '', hint: '', code: '' }
      }), RPC_TIMEOUT_MS))
    ]);
    if(error) throw error;
    SB_UNREACHABLE = false;
    SAVE_ERROR = null;
    return { ok:true, data, noReply: false };
  }catch(e){
    // Empty/missing code = no real reply ever arrived (network failure or
    // our own timeout above). A real, non-empty code - P0001 or otherwise -
    // means the server actually answered, whatever that answer was.
    const noReply = !(e && e.code);
    if(e && e.code === 'P0001' && e.message){
      SAVE_ERROR = e.message;   // a clear business-rule refusal written for staff to read
    } else {
      SB_UNREACHABLE = true;
      SAVE_ERROR = "THAT ENTRY MAY NOT BE SAVED. The app could not reach the shared database. Check your internet, then check whether it recorded.";
    }
    return { ok:false, error: SAVE_ERROR, noReply };
  }
}
function cacheKey(shopId){ return 'twcache_' + shopId + (ADMIN_SESSION ? '_admin' : '_staff'); }
function hydrateFromCache(shopId){

async function ensureStaffNames(ids){

function ledgerEntryText(e){

// Best-effort instant push updates when another device changes this shop's
// data. If this fails to connect for any reason, the existing 15-second
// background refresh (further down) still keeps everyone in sync regardless
// - this is a snappiness upgrade, not something anything else depends on.
let REALTIME_CHANNELS = {};
function subscribeToShop(shopId){
  if(!sb || typeof sb.channel !== 'function' || REALTIME_CHANNELS[shopId]) return;
  try{
    const bump = () => refreshShopData(shopId).then(()=>{ if(S.shopId===shopId || S.mgmtShop===shopId) render(); });
    const ch = sb.channel('shop-'+shopId+(ADMIN_SESSION?'-admin':'-staff'))
      .on('postgres_changes', {event:'*', schema:'public', table:'phones', filter:'shop_id=eq.'+shopId}, bump)
      .on('postgres_changes', {event:'*', schema:'public', table:'daily_logs', filter:'shop_id=eq.'+shopId}, bump)
      .on('postgres_changes', {event:'*', schema:'public', table:'business_days', filter:'shop_id=eq.'+shopId}, bump)
      .subscribe();
    REALTIME_CHANNELS[shopId] = ch;
  }catch(e){ /* realtime is a nice-to-have; the poll timer still covers us */ }
}
async function loadShopData(shopId){
  if(!SHOP_CACHE[shopId]) hydrateFromCache(shopId);
  subscribeToShop(shopId);
  if(SHOP_CACHE[shopId]){
    refreshShopData(shopId).then(()=>{ if(S.shopId===shopId || S.mgmtShop===shopId) render(); });
    return SHOP_CACHE[shopId];
  }
  return refreshShopData(shopId);
}
async function refreshShopData(shopId){
  if(!sb){ SB_UNREACHABLE = true; if(!SHOP_CACHE[shopId]) SHOP_CACHE[shopId] = emptyShopData(); return SHOP_CACHE[shopId]; }
  const isAdmin = !!ADMIN_SESSION;
  const phonesTable = isAdmin ? 'phones' : 'phones_staff_view';
  const ledgerTable = isAdmin ? 'ledger' : 'ledger_staff_view';
  // Admin reads the real table (its own is_admin() policy still allows this).
  // Staff are never authenticated Supabase Auth users, so a table policy
  // can't single them out - the narrow door for them is this RPC instead,
  // scoped to one shop's last 60 days rather than every shop's full history.
  const logsPromise = isAdmin
    ? sb.from('daily_logs').select('*').eq('shop_id', shopId)
    : sb.rpc('staff_recent_daily_logs', {p_shop_id: shopId});
  try{
    const [phonesRes, logsRes, daysRes, ledgerRes] = await Promise.all([
      sb.from(phonesTable).select('*').eq('shop_id', shopId),
      logsPromise,
      sb.from('business_days').select('*').eq('shop_id', shopId),
      sb.from(ledgerTable).select('*').eq('shop_id', shopId).order('ts',{ascending:false}).limit(5000)
    ]);
    if(phonesRes.error) throw phonesRes.error;
    if(logsRes.error) throw logsRes.error;
    if(daysRes.error) throw daysRes.error;
    if(ledgerRes.error) throw ledgerRes.error;
    await ensureStaffNames(ledgerRes.data.map(r=>r.by_staff).concat(logsRes.data.map(r=>r.submitted_by)));
    const ledger = ledgerRes.data.map(mapLedgerRow);
    const data = {
      inventory: phonesRes.data.map(mapPhoneRow),
      dailyLogs: logsRes.data.map(mapLogRow),
      businessDays: daysRes.data.map(mapDayRow),
      ledger,
      activity: ledger.map(e => ({ ts: e.ts, type: e.type, text: ledgerEntryText(e) }))
    };
    SHOP_CACHE[shopId] = data;
    SB_UNREACHABLE = false;
    LAST_SYNC_AT[shopId] = new Date();
    cacheToLocal(shopId, data);
  }catch(e){
    SB_UNREACHABLE = true;
    if(!SHOP_CACHE[shopId]) SHOP_CACHE[shopId] = emptyShopData();
  }
  return SHOP_CACHE[shopId];
}

// Live refresh: shared data can change on another phone at any moment.
const LIVE_VIEWS = ['ownerDash','staffDash','staffMenu','ownerTransactions','ownerDayReport','ownerManage','ownerCashDetail','ownerFaulty'];
let POLL_TIMER = null;
let LAST_SYNC = null;
// Which shop(s) the current admin screen actually needs fresh data for, so a
// 15-second poll doesn't reload all three shops when only one is on screen.
// The "All shops" tab/scope is the one case that genuinely needs everything.
function relevantAdminShopIds(){
  if(S.view === 'ownerDash'){
    return (S.dashShop && S.dashShop !== 'all') ? [S.dashShop] : SHOPS.map(x=>x.id);
  }
  if(S.view === 'ownerTransactions'){
    return (S.txShop && S.txShop !== 'all') ? [S.txShop] : SHOPS.map(x=>x.id);
  }
  if(S.mgmtShop) return [S.mgmtShop];
  if(S.sheetShop) return [S.sheetShop];
  return SHOPS.map(x=>x.id);
}
function startPolling(){
  if(POLL_TIMER) return;
  POLL_TIMER = setInterval(()=>{ pollTick(); }, 15000);
}
async function pollTick(force){
  if(!force){
    if(LIVE_VIEWS.indexOf(S.view) === -1) return;
    if(document.getElementById('modalOverlay')) return;
    const ae = document.activeElement;
    if(ae && ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName) >= 0) return;
  }
  const ids = (S.view.indexOf('owner')===0) ? relevantAdminShopIds() : (S.shopId ? [S.shopId] : []);
  let changed = false;
  for(const id of ids){
    const before = JSON.stringify(SHOP_CACHE[id] || null);
    await refreshShopData(id);
    if(JSON.stringify(SHOP_CACHE[id]) !== before) changed = true;
  }
  LAST_SYNC = new Date();
  if(changed || force) render();
}
function syncLabel(){
  return LAST_SYNC ? 'Updated ' + LAST_SYNC.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : 'Live';
}
function refreshRow(){
  return `<div class="refresh-row">
    <span class="live">&#9679; ${esc(syncLabel())} &middot; refreshes automatically</span>
    <button class="mini-btn" onclick="pollTick(true)">Refresh now</button>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  // Nobody should be half-admin, half-staff. Checked on every render rather
  // than at each place staffId can get set, so it can't be missed by a call
  // site that forgets to clear it.
  if(S.staffId && ADMIN_SESSION) clearAdminSession();
  try{
    app.innerHTML = offlineBanner() + saveErrorBanner() + viewFor(S.view) + (MENU_OPEN ? renderMenuPanel() : '');
  }catch(e){

}
// Shows the .table-scroll right-edge fade only while there is genuinely
// more content to the right RIGHT NOW - not just whether the table is wider
// than its frame in general. Checking scrollWidth > clientWidth alone (the
// old check) stays true for the table's entire lifetime once it overflows,
// so the fade never turned off even after scrolling all the way right -
// it sat there permanently, washing over whatever column happened to land
// at the edge. Comparing against scrollLeft is what makes it disappear once
// there's nothing left to reveal.
function tableScrollHasMoreRight(el){
  return el.scrollWidth > el.clientWidth + 1 && (el.scrollLeft + el.clientWidth) < (el.scrollWidth - 1);
}
function updateTableFadeFor(el){
  el.classList.toggle('has-overflow', tableScrollHasMoreRight(el));
}
function updateTableFades(){
  document.querySelectorAll('.table-scroll').forEach(updateTableFadeFor);
}
// scroll events on an element don't bubble, but they DO still fire on
// ancestors during the CAPTURING phase - so one delegated listener here
// covers every .table-scroll frame that exists now or gets rendered later,
// with no per-render listener setup/teardown needed.
document.addEventListener('scroll', function(e){
  if(e.target && e.target.classList && e.target.classList.contains('table-scroll')) updateTableFadeFor(e.target);
}, true);
function showFatal(err, headline){

    <div class="fatal-box">

      <p>This usually means the app was opened as a plain file instead of through your shared Shop Tracker link. Open the link the owner sent you, then try again.</p>
      <p>If you opened the correct link, check your internet connection and press the button below.</p>
      <button class="btn btn-primary btn-full-center" onclick="location.reload()">Try again</button>
      <p style="margin-top:14px;"><code>${esc(msg)}</code></p>
    </div>`;
}

// out anything typed but not yet synced back into S (e.g. IMEI boxes, the

function renderMenu(){

// Several forms keep their live values only in the DOM until their own submit
// button runs - a receiving document's IMEI boxes, the sale price box, the
// end-of-day counts - and never sync into S as you type. A guard that only
// looked at S would see an empty draft and let the jump through, so this
// reads the actual on-screen inputs instead (falling back to S only where an
// input isn't currently rendered, e.g. mid-batch between IMEI lines).
// Returns null if nothing would be lost, else which kind of form it is, so
// the confirm message can name the right thing.
function unsavedEntryKind(){
  if(S.receiveBatch && S.receiveBatch.lines && S.receiveBatch.lines.length > 0) return 'receiving';
  const imeiRows = document.querySelectorAll('.imeiRow');
  if(imeiRows.length){
    if([...imeiRows].some(inp => inp.value.trim())) return 'receiving';
  } else if(S.receiveLineDraft && S.receiveLineDraft.imeis && S.receiveLineDraft.imeis.some(v => v)){
    return 'receiving';
  }
  const priceInput = document.getElementById('priceInput');
  if(priceInput && priceInput.value.trim() !== (priceInput.defaultValue||'').trim()) return 'sale';
  const eodChanged = ['eodCount','eodFaulty','eodCash'].some(id=>{
    const inp = document.getElementById(id);
    return inp && inp.value.trim() !== (inp.defaultValue||'').trim();
  });
  if(eodChanged) return 'eod';
  return null;
}
const UNSAVED_ENTRY_MESSAGES = {
  receiving: "Leave this stock receiving document? Any IMEIs you've typed but not saved yet will be lost.",
  sale: "Leave without confirming this sale? The price you've entered will be lost.",
  eod: "Leave without submitting end of day? The count and cash you've entered will be lost."
};
// beforeGo mutates S (e.g. clearing staffId to switch identity) only once we
// know navigation is actually happening - if the user cancels the unsaved-
// work prompt, nothing about the current session should change.
async function menuNavigate(view, extra, beforeGo){
  const unsavedKind = unsavedEntryKind();
  if(unsavedKind){
    closeMenu();
    const ok = await askConfirm(UNSAVED_ENTRY_MESSAGES[unsavedKind], 'Yes, leave it');
    if(!ok) return;
  } else {
    closeMenu();
  }
  if(beforeGo) beforeGo();
  BACK_STACK = [];
  go(view, extra);
}
function currentMenuShopId(){
  if(S.staffId && S.shopId) return S.shopId;
  if(ADMIN_SESSION){
    if(S.mgmtShop) return S.mgmtShop;

  }
  return null;
}

}

  const shop = SHOPS.find(s=>s.id===shopId);

    ? `Signed in as ${esc(S.staffName||'')}${curShop ? ' &middot; '+esc(shopName(curShop)) : ''}`

  return `<div class="menu-overlay no-print" onclick="if(event.target===this) closeMenu();">
    <div class="menu-panel">
      <div class="menu-panel-head">
        <div style="font-weight:700;font-size:15px;">Menu</div>

      ${homeRows.join('')}

      ${shopRows}

    </div>

}

// Single choke point for every admin-only screen. Individual entry points
// (the menu, buttons inside owner screens) already check ADMIN_SESSION before
// navigating, but this is the one place that actually renders a view, so it's
// the backstop that stays correct even if a future call site forgets to
// check, or S.view ends up here some other way (stale back-stack, etc).
const OWNER_ONLY_VIEWS = ['ownerDash','ownerSettings','wipeShop','ownerManage','ownerPricing','ownerDayReport','ownerTransactions','ownerCashDetail','ownerFaulty'];
function viewFor(v){
  if(OWNER_ONLY_VIEWS.indexOf(v) !== -1 && !ADMIN_SESSION){
    return screenAdminLogin();
  }
  switch(v){
    case 'home': return screenHome();
    case 'staffShop': return screenStaffShop();
    case 'staffPicker': return screenStaffPicker();
    case 'staffPinEntry': return screenStaffPinEntry();
    case 'staffMenu': return screenStaffMenu();
    case 'staffDash': return screenStaffDash();
    case 'sale': return screenSale();
    case 'salePrice': return screenSalePrice();
    case 'return': return screenReturn();
    case 'returnReason': return screenReturnReason();
    case 'receive': return screenReceive();
    case 'eod': return screenEod();
    case 'adminLogin': return screenAdminLogin();
    case 'ownerDash': return screenOwnerDash();
    case 'ownerSettings': return screenOwnerSettings();
    case 'wipeShop': return screenWipeShop();
    case 'ownerManage': return screenOwnerManage();
    case 'ownerPricing': return screenOwnerPricing();
    case 'ownerDayReport': return screenOwnerDayReport();
    case 'ownerTransactions': return screenOwnerTransactions();
    case 'ownerCashDetail': return screenOwnerCashDetail();
    case 'ownerFaulty': return screenOwnerFaulty();
    case 'stockSheet': return screenStockSheet();
    default: return screenHome();
  }
}

async function loadStaffList(shopId){
  if(!sb){ SB_UNREACHABLE = true; STAFF_LIST_CACHE[shopId] = STAFF_LIST_CACHE[shopId] || []; return STAFF_LIST_CACHE[shopId]; }
  try{
    const { data, error } = await sb.from('staff_public').select('id,name').eq('shop_id', shopId).eq('active', true).order('name');
    if(error) throw error;
    STAFF_LIST_CACHE[shopId] = data || [];
    (data||[]).forEach(s=>{ STAFF_NAME_INDEX[s.id] = s.name; });
    SB_UNREACHABLE = false;
  }catch(e){
    STAFF_LIST_CACHE[shopId] = STAFF_LIST_CACHE[shopId] || [];
    SB_UNREACHABLE = true;
  }
  return STAFF_LIST_CACHE[shopId];
}

async function submitStaffPin(){
  const val = document.getElementById('pinInput').value.trim();
  if(!val){ document.getElementById('pinErr').innerHTML = '<div class="err">Enter your PIN.</div>'; return; }
  if(!sb){ document.getElementById('pinErr').innerHTML = "<div class=\"err\">Can't reach the shared database right now. Check your internet and try again.</div>"; return; }
  try{
    const { data, error } = await sb.rpc('staff_login', {p_staff_id: S.pendingStaffId, p_pin: val});
    if(error) throw error;
    if(!data || data.length===0){
      document.getElementById('pinErr').innerHTML = '<div class="err">That PIN is not correct.</div>';
      return;
    }
    S.staffId = data[0].id;
    S.staffName = data[0].name;
    await loadShopData(S.shopId);
    navTo('staffMenu');
  }catch(e){
    document.getElementById('pinErr').innerHTML = "<div class=\"err\">Could not check your PIN. Check your internet and try again.</div>";
  }
}

function screenStaffDash(){
  const data = SHOP_CACHE[S.shopId] || emptyShopData();
  const threshold = (CONFIG.lowStockThreshold !== undefined) ? CONFIG.lowStockThreshold : DEFAULT_LOW_STOCK;
  const inStock = data.inventory.filter(p=>p.status==='in_stock');
  const byModel = {};
  inStock.forEach(p=>{
    const key = p.model + (p.description ? ' - ' + p.description : '');
    byModel[key] = (byModel[key]||0) + 1;
  });
  const stockKeys = Object.keys(byModel).sort();
  const stockRows = stockKeys.map(k=>`
    <tr><td>${esc(k)}</td><td>${byModel[k]}</td><td>${byModel[k]<=threshold ? '<span class="chip chip-red">Re-up needed</span>' : '<span class="chip chip-green">OK</span>'}</td></tr>
  `).join('');
  const stockTotal = stockKeys.reduce((a,k)=>a+byModel[k],0);
  const lowCount = stockKeys.filter(k=>byModel[k]<=threshold).length;

  const faultyList = data.inventory.filter(p=>p.status==='faulty').sort((a,b)=>(b.returnedTs||0)-(a.returnedTs||0));
  const recentSales = data.inventory.filter(p=>p.status==='sold').sort((a,b)=>(b.dateSold||'').localeCompare(a.dateSold||'')).slice(0,10);
  const recentReturns = data.inventory.filter(p=>p.dateReturned).sort((a,b)=>(b.dateReturned||'').localeCompare(a.dateReturned||'')).slice(0,10);
  const recentReceiving = data.activity.filter(a=>a.type==='received').slice(0,10);

  return `
  ${topbar(shopName(S.shopId), 'Shop dashboard', true)}
  <div class="content">
    ${refreshRow()}
    <div class="print-only sheet-head" style="margin-bottom:16px;">
      <div>
        <div class="biz">TOWDAH ELECTRONICS</div>
        <div class="meta">Shop dashboard &middot; ${esc(shopName(S.shopId))}</div>
      </div>
      <div class="meta" style="text-align:right;">Printed: ${esc(nowLabel())}</div>
    </div>
    <button class="btn btn-amber btn-full-center no-print" onclick="window.print()">Print this dashboard</button>
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:14px;" class="no-print">Prints stock levels, the faulty shelf, and recent activity below - handy for a quick paper check or to hand to the owner.</div>
    ${lowCount>0 ? `<div class="warn-banner">${lowCount} model(s) are running low and may need a re-up.</div>` : ''}
    ${faultyList.length>0 ? `<div class="section-flag">${faultyList.length} phone(s) on the faulty shelf - not for sale.</div>` : ''}
    <h2>Stock levels</h2>
    <div class="card">
      ${stockRows ? `<div class="table-scroll"><table class="stock-table"><tr><th>Model</th><th>Qty</th><th>Status</th></tr>${stockRows}<tr class="total-row"><td>Total</td><td>${stockTotal}</td><td></td></tr></table></div>` : '<div class="empty">No stock recorded.</div>'}
    </div>

    <h2>Faulty shelf</h2>
    <div class="card">
      ${faultyList.length===0 ? '<div class="empty">Nothing on the faulty shelf.</div>' : faultyList.map(p=>`
        <div class="activity-row"><div class="txt">${esc(p.model)}${p.description?' - '+esc(p.description):''}<div class="imei">IMEI: ${esc(p.imei)}${p.faultParts&&p.faultParts.length?' &middot; '+esc(p.faultParts.join(', ')):''}</div></div><div class="time">${esc(p.dateReturned||'')}</div></div>
      `).join('')}
    </div>

    <h2>Recent sales</h2>
    <div class="card">
      ${recentSales.length===0 ? '<div class="empty">No sales yet.</div>' : recentSales.map(p=>`
        <div class="activity-row"><div class="txt">${esc(p.model)}${p.description?' - '+esc(p.description):''} &middot; ${money(p.salePrice)}</div><div class="time">${esc(p.dateSold)}</div></div>
      `).join('')}
    </div>

    <h2>Recent returns</h2>
    <div class="card">
      ${recentReturns.length===0 ? '<div class="empty">No returns yet.</div>' : recentReturns.map(p=>`
        <div class="activity-row"><div class="txt">${esc(p.model)} &middot; ${esc(p.returnReason||'')}</div><div class="time">${esc(p.dateReturned)}</div></div>
      `).join('')}
    </div>

    <h2>Stock receiving updates</h2>
    <div class="card">
      ${recentReceiving.length===0 ? '<div class="empty">No stock received yet.</div>' : recentReceiving.map(a=>`
        <div class="activity-row"><div class="txt">${esc(a.text)}</div><div class="time">${new Date(a.ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</div></div>
      `).join('')}
    </div>
  </div>`;

function attachSearchFilter(inputId, listId){
  const input = document.getElementById(inputId);
  if(!input) return;
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    const items = document.querySelectorAll('#'+listId+' .list-item');
    items.forEach(it=>{
      const m = it.getAttribute('data-model')||'';
      const im = it.getAttribute('data-imei')||'';
      it.style.display = (m.includes(q) || im.includes(q)) ? '' : 'none';
    });
  });
}
function pickSalePhone(phoneId){

function screenReceiveModelPick(){
  const batchCount = (S.receiveBatch && S.receiveBatch.lines.length) || 0;

    <button class="btn btn-outline btn-full-center" style="margin-top:18px;" onclick="pickModelOther()">Not listed - type it in</button>
    ${batchCount>0 ? `<button class="btn btn-outline btn-full-center" onclick="S.receiveStep='batchSummary';render();">Back to item list</button>` : ''}
  </div>`;

function modelOptBtn(m){
  return `<div class="reason-btn model-opt" data-m="${esc(m.nameKey)}" onclick="pickModel('${esc(m.name).replace(/'/g,"\\'")}')">${esc(m.name)}</div>`;
}
function attachModelFilter(){
  const input = document.getElementById('modelSearch');
  if(!input) return;
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll('#modelPickList .model-opt').forEach(el=>{
      const m = el.getAttribute('data-m')||'';
      const show = m.includes(q);
      el.style.display = show ? '' : 'none';
      if(show) visible++;
    });
    document.querySelectorAll('#modelPickList .model-brand').forEach(h=>{
      const grid = h.nextElementSibling;
      const anyVisible = grid && [...grid.children].some(c=>c.style.display!=='none');
      h.style.display = anyVisible ? '' : 'none';
      if(grid) grid.style.display = anyVisible ? '' : 'none';
    });
    document.getElementById('modelEmptyMsg').style.display = visible===0 ? '' : 'none';
  });
}
function pickModel(m){
  S.modelNearMatch = null; S.modelNearMatchDismissed = false;
  S.receiveLineDraft = Object.assign({}, S.receiveLineDraft, {model: m, useManual: false});
  render();
}
function pickModelOther(){
  S.modelNearMatch = null; S.modelNearMatchDismissed = false;
  S.receiveLineDraft = Object.assign({}, S.receiveLineDraft, {model: '', useManual: true});
  render();
}
function changeModel(){
  syncLineDetailsDraft();
  S.modelNearMatch = null; S.modelNearMatchDismissed = false;
  S.receiveLineDraft = Object.assign({}, S.receiveLineDraft, {model: '', useManual: false});
  render();
}
function syncLineDetailsDraft(){
  const d = S.receiveLineDraft || {};
  const descEl = document.getElementById('recvDesc');
  const qtyEl = document.getElementById('recvQty');
  if(descEl) d.description = descEl.value.trim();
  if(qtyEl) d.qty = qtyEl.value.trim();
  S.receiveLineDraft = d;
}
function proceedToLineImeis(){
  const d = S.receiveLineDraft || {};
  const model = d.useManual ? document.getElementById('recvModel').value.trim() : (d.model||'').trim();
  const description = document.getElementById('recvDesc').value.trim();
  const qty = parseInt(document.getElementById('recvQty').value.trim());
  if(!model){ document.getElementById('recvErr').innerHTML = '<div class="err">Select or enter the phone model.</div>'; return; }
  if(isNaN(qty) || qty<=0 || qty>200){ document.getElementById('recvErr').innerHTML = '<div class="err">Enter how many pieces (1-200).</div>'; return; }
  if(d.useManual && !S.modelNearMatchDismissed){
    const nearMatch = findNearMatchModel(model);
    if(nearMatch){
      S.receiveLineDraft = {model, description, qty, useManual: true};
      S.modelNearMatch = {typed: model, suggestionName: nearMatch.name};
      render();
      return;
    }
  }
  S.modelNearMatch = null;
  S.modelNearMatchDismissed = false;
  S.receiveLineDraft = {model, description, qty, imeis: new Array(qty).fill('')};
  S.receiveStep = 'lineImeis';
  render();
}
function acceptNearMatchModel(){
  const suggestion = S.modelNearMatch.suggestionName;
  S.modelNearMatch = null;
  S.receiveLineDraft = Object.assign({}, S.receiveLineDraft, {model: suggestion, useManual: false});
  proceedToLineImeis();
}
function dismissNearMatchModel(){
  S.modelNearMatch = null;
  S.modelNearMatchDismissed = true;
  proceedToLineImeis();
}
function screenReceiveLineImeis(){
  const d = S.receiveLineDraft;
  const rows = d.imeis.map((val,i)=>`
    <div class="field" style="margin-bottom:10px;">
      <label>IMEI ${i+1} of ${d.qty}</label>
      <input type="text" inputmode="numeric" class="imeiRow" data-idx="${i}" value="${esc(val)}" placeholder="15-digit IMEI">
    </div>`).join('');
  return `
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      ${menuButton()}
      <div>
        <div class="title">Stock receiving document</div>
        <div class="sub">${esc(d.model)}${d.description?' - '+esc(d.description):''} &middot; ${d.qty} pcs</div>
      </div>
    </div>
    <button class="back" onclick="S.receiveStep='lineDetails';render();">Back</button>
  </div>
  <div class="content">
    ${rows}
    <div id="recvImeiErr"></div>
    <button class="btn btn-primary btn-full-center" onclick="confirmLine()">Add this item to the document</button>
  </div>`;
}
function confirmLine(){
  const d = S.receiveLineDraft;
  const inputs = [...document.querySelectorAll('.imeiRow')];
  const imeis = inputs.map(inp=>inp.value.trim());
  if(imeis.some(v=>!v)){ document.getElementById('recvImeiErr').innerHTML = '<div class="err">Enter every IMEI before continuing.</div>'; return; }
  const data = SHOP_CACHE[S.shopId];
  // (imei, model) is the real rule, not imei alone - two real phones can
  // legitimately share an IMEI across different models. cleanModelKey() is
  // computed here rather than read off phones_staff_view's model_key column,
  // so this stays correct even if that column is momentarily unavailable -
  // it only ever needs `model`, which every row always has.
  const modelKey = cleanModelKey(d.model);
  const existingPairs = new Set(data.inventory.map(p=>p.imei+'|'+cleanModelKey(p.model)));
  (S.receiveBatch.lines||[]).forEach(l=>{
    const lineKey = cleanModelKey(l.model);
    l.imeis.forEach(im=>existingPairs.add(im+'|'+lineKey));
  });
  const dupes = imeis.filter(im=>existingPairs.has(im+'|'+modelKey));
  if(dupes.length>0){ document.getElementById('recvImeiErr').innerHTML = '<div class="err">Already recorded: '+esc(dupes.map(im=>im+' ('+d.model+')').join(', '))+'</div>'; return; }
  S.receiveBatch.lines.push({batchId: genBatchId(), model: d.model, description: d.description, qty: d.qty, imeis});
  S.receiveLineDraft = null;
  S.receiveStep = 'batchSummary';
  render();
}
function screenReceiveBatchSummary(){
  const lines = S.receiveBatch.lines || [];
  const totalPcs = lines.reduce((a,l)=>a+l.qty,0);
  return `
  ${topbar('Stock receiving document', shopName(S.shopId), true)}
  <div class="content">
    <h2>Items in this document</h2>
    <div class="card">
      ${lines.length===0 ? '<div class="empty">No items added yet.</div>' : lines.map(l=>`
        <div class="activity-row"><div class="txt">${esc(l.model)}${l.description?' - '+esc(l.description):''}</div><div class="time">${l.qty} pcs</div></div>
      `).join('')}
    </div>
    <div style="font-size:13px;color:var(--text-soft);margin-bottom:16px;">Total: ${totalPcs} phone(s) across ${lines.length} item(s)</div>
    <button class="btn btn-primary btn-full-center" onclick="S.receiveStep='lineDetails';render();">Add another colour or model</button>

}
async function finishReceiving(){
  const lines = S.receiveBatch.lines || [];
  if(lines.length===0) return;
  const items = lines.map(l => ({ model: l.model, description: l.description || '', imeis: l.imeis }));
  const label = lockBtnSaving('receiveFinishBtn');
  const res = await callRpc('staff_receive_stock', {p_shop_id: S.shopId, p_staff_id: S.staffId, p_local_date: todayStr(), p_items: items, p_idempotency_key: S.receiveIdemKey});
  const app = document.getElementById('app');
  if(!res.ok){
    unlockBtn('receiveFinishBtn', label);
    app.innerHTML = offlineBanner() + saveErrorBanner() + `
      ${topbar(shopName(S.shopId), '', true)}
      <div class="content">
        <div class="err" style="margin-bottom:14px;">${esc(res.error)}</div>
        <p class="lead">Nothing in this document was saved. Nothing else here has been lost — go back, fix the item causing the problem, and try again.</p>
        <button class="btn btn-primary btn-full-center" onclick="S.receiveStep='batchSummary';render();">Back to this document</button>
      </div>`;
    return;
  }
  const totalAdded = res.data;
  await refreshShopData(S.shopId);
  await loadShopsAndModels(); // picks up any model staff just typed as new
  S.receiveBatch = {lines:[]};
  S.receiveIdemKey = null;
  S.receiveLineDraft = null;
  S.receiveStep = 'lineDetails';
  app.innerHTML = offlineBanner() + saveErrorBanner() + `
    ${topbar(shopName(S.shopId), '', false)}
    <div class="content">
      <div class="success-box"><div class="check">&#10003;</div><div class="msg">${totalAdded} phone(s) added to stock.</div></div>
      <button class="btn btn-primary btn-full-center" onclick="go('receive')">Receive more stock</button>
      <button class="btn btn-outline btn-full-center" onclick="go('staffMenu')">Back to menu</button>
    </div>`;
}

async function confirmEod(){

  if(isNaN(count) || count<0){ document.getElementById('eodErr').innerHTML = '<div class="err">Enter how many good phones you counted.</div>'; return; }
  if(isNaN(faulty) || faulty<0){ document.getElementById('eodErr').innerHTML = '<div class="err">Enter how many faulty phones you counted (put 0 if none).</div>'; return; }
  if(isNaN(cash) || cash<0){ document.getElementById('eodErr').innerHTML = '<div class="err">Enter the cash collected today.</div>'; return; }
  const today = todayStr();
  const label = lockBtnSaving('eodSubmitBtn');
  const res = await callRpc('staff_submit_eod', {p_shop_id: S.shopId, p_staff_id: S.staffId, p_local_date: today, p_physical_count: count, p_faulty_count: faulty, p_cash: cash, p_idempotency_key: S.eodIdemKey});

    document.getElementById('eodErr').innerHTML = '<div class="err">'+esc(res.error)+'</div>';

  await refreshShopData(S.shopId);
  showSuccessThen('End of day submitted. Thank you!', 'staffMenu');

async function submitAdminLogin(){
  const email = document.getElementById('adminEmail').value.trim();
  const pw = document.getElementById('adminPass').value;
  if(!email || !pw){ document.getElementById('adminErr').innerHTML = '<div class="err">Enter your email and password.</div>'; return; }
  if(!sb){ document.getElementById('adminErr').innerHTML = "<div class=\"err\">Can't reach the shared database right now. Check your internet and try again.</div>"; return; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if(error) throw error;
    const ok = await resolveAdminSession(data.user && data.user.id);
    if(!ok){
      await sb.auth.signOut();
      document.getElementById('adminErr').innerHTML = '<div class="err">That login works, but is not set up as an admin. Ask whoever set up the database to add you.</div>';
      return;
    }
    await Promise.all(SHOPS.map(s=>loadShopData(s.id)));
    S.dashShop = 'all';
    navTo('ownerDash');
  } catch(e){
    document.getElementById('adminErr').innerHTML = '<div class="err">That email or password is not correct.</div>';
  }
}
// Looks up whether a signed-in Supabase Auth user is registered as an admin,
// and sets ADMIN_SESSION if so. Called right after a successful password
// login - the client is created with persistSession:false, so there is no
// stored session to restore on reload; the admin signs in fresh every time.
async function resolveAdminSession(userId){
  if(!userId) return false;
  try{
    const { data, error } = await sb.from('admins').select('username').eq('user_id', userId).single();
    if(error || !data) return false;
    ADMIN_SESSION = { userId, username: data.username };
    return true;
  }catch(e){ return false; }
}
// The one place that drops an admin session, whether by explicit log-out or
// because the app decided it shouldn't be held any more (e.g. entering the
// staff flow). Always kills the underlying Supabase Auth token too, not just
// the app-level flag, so nothing can silently resurrect it.
async function clearAdminSession(){
  if(!ADMIN_SESSION) return;
  ADMIN_SESSION = null;
  if(sb) try{ await sb.auth.signOut(); }catch(e){}
}
async function adminSignOut(){
  await clearAdminSession();
  navHome();
}

function shopStats(data, date){
  const soldToday = data.inventory.filter(p=>p.status==='sold' && p.dateSold===date);
  const revenue = soldToday.reduce((a,p)=>a+(p.salePrice||0),0);
  const cost = soldToday.reduce((a,p)=>a+(p.costPrice||0),0);
  const profit = revenue - cost;
  const unitsSold = soldToday.length;
  const returnsToday = data.inventory.filter(p=>p.dateReturned===date).length;
  const receivedToday = data.inventory.filter(p=>p.dateReceived===date).length;
  const systemStock = data.inventory.filter(p=>p.status==='in_stock').length;
  const systemFaulty = data.inventory.filter(p=>p.status==='faulty').length;
  const writtenOff = data.inventory.filter(p=>p.status==='written_off');
  const writtenOffCost = writtenOff.reduce((a,p)=>a+(p.costPrice||0),0);
  const belowToday = soldToday.filter(p=>p.belowPrice);
  const belowShortfall = belowToday.reduce((a,p)=>a+(p.priceShortfall||0),0);
  const log = data.dailyLogs.find(l=>l.date===date);
  const variance = log ? (log.physicalCount - systemStock) : null;
  const faultyVariance = (log && log.faultyCount !== undefined && log.faultyCount !== null) ? (log.faultyCount - systemFaulty) : null;
  const bd = getBizDay(data, date);
  const reopened = !!(bd && bd.reopenCount);
  return {revenue, cost, profit, unitsSold, returnsToday, receivedToday, systemStock, systemFaulty,
          writtenOffCount: writtenOff.length, writtenOffCost,
          belowCount: belowToday.length, belowShortfall,
          log, variance, faultyVariance, reopened};
}
function cashNet(log){ return (log.cash||0) + ((log.adjustments||[]).reduce((a,x)=>a+x.amount,0)); }
function statsForRange(data, start, end){
  const sold = data.inventory.filter(p=>p.status==='sold' && p.dateSold && p.dateSold>=start && p.dateSold<=end);
  const revenue = sold.reduce((a,p)=>a+(p.salePrice||0),0);
  const cost = sold.reduce((a,p)=>a+(p.costPrice||0),0);
  const profit = revenue - cost;
  const units = sold.length;
  const cash = data.dailyLogs.filter(l=>l.date>=start && l.date<=end).reduce((a,l)=>a+cashNet(l),0);
  const below = sold.filter(p=>p.belowPrice);
  const belowCount = below.length;
  const belowShortfall = below.reduce((a,p)=>a+(p.priceShortfall||0),0);
  return {revenue, profit, units, cash, belowCount, belowShortfall};
}
function lastNDaysRange(n){
  const end = todayStr();
  const start = daysAgoStr(n-1);
  return {start, end};
}
function allTimeStats(data){ return statsForRange(data, '0000-01-01', '9999-12-31'); }
function last7Series(data){
  const days = [];
  for(let i=6;i>=0;i--){
    const ds = daysAgoStr(i);
    const st = statsForRange(data, ds, ds);
    days.push({date: ds, revenue: st.revenue});
  }
  return days;
}

function renderStockByModel(data){
  const inStock = data.inventory.filter(p=>p.status==='in_stock');
  if(inStock.length===0) return '<div class="empty">No stock currently recorded.</div>';
  const byModel = {};
  inStock.forEach(p=>{
    const key = p.model + (p.description ? ' - ' + p.description : '');
    if(!byModel[key]) byModel[key] = {count:0, value:0, potential:0};
    byModel[key].count++;
    byModel[key].value += (p.costPrice||0);
    byModel[key].potential += ((p.listPrice||p.costPrice||0) - (p.costPrice||0));
  });
  const rows = Object.keys(byModel).sort().map(m=>`
    <tr><td>${esc(m)}</td><td>${byModel[m].count}</td><td>${money(byModel[m].value)}</td><td>${money(byModel[m].potential)}</td></tr>
  `).join('');
  const totals = Object.values(byModel).reduce((a,x)=>({count:a.count+x.count, value:a.value+x.value, potential:a.potential+x.potential}), {count:0,value:0,potential:0});
  return `<div class="table-scroll"><table class="stock-table">
    <tr><th>Model</th><th>Units</th><th>Cost value</th><th>Exp. profit</th></tr>
    ${rows}
    <tr class="total-row"><td>Total</td><td>${totals.count}</td><td>${money(totals.value)}</td><td>${money(totals.potential)}</td></tr>
  </table></div>`;
}
function renderStockByModelAll(allData){
  const byModel = {};
  SHOPS.forEach(sh=>{
    (allData[sh.id].inventory||[]).filter(p=>p.status==='in_stock').forEach(p=>{
      const key = p.model + (p.description ? ' - ' + p.description : '');
      if(!byModel[key]) byModel[key] = {total:0, perShop:{}};
      byModel[key].total++;
      byModel[key].perShop[sh.id] = (byModel[key].perShop[sh.id]||0) + 1;
    });
  });
  const keys = Object.keys(byModel).sort();
  if(keys.length===0) return '<div class="empty">No stock currently recorded in any shop.</div>';
  const threshold = (CONFIG.lowStockThreshold !== undefined) ? CONFIG.lowStockThreshold : DEFAULT_LOW_STOCK;
  const shopTotals = SHOPS.map(sh=>keys.reduce((a,k)=>a+(byModel[k].perShop[sh.id]||0),0));
  const grandTotal = keys.reduce((a,k)=>a+byModel[k].total,0);
  return `<div class="table-scroll"><table class="stock-table">
    <tr><th>Model</th>${SHOPS.map(sh=>`<th>${esc(sh.name.split(' ')[0])}${sh.id==='bulawayo2'?' 2':(sh.id==='bulawayo1'?' 1':'')}</th>`).join('')}<th>Total</th></tr>
    ${keys.map(k=>`<tr>
      <td>${esc(k)} ${byModel[k].total<=threshold?'<span class="chip chip-red">Re-up</span>':''}</td>
      ${SHOPS.map(sh=>`<td>${byModel[k].perShop[sh.id]||0}</td>`).join('')}
      <td><strong>${byModel[k].total}</strong></td>
    </tr>`).join('')}
    <tr class="total-row">
      <td>Total</td>
      ${shopTotals.map(t=>`<td>${t}</td>`).join('')}
      <td>${grandTotal}</td>
    </tr>
  </table></div>`;
}

function endOfDayTs(d){ return new Date(d + 'T23:59:59.999').getTime(); }

function replayState(events, untilTs){
  const st = {};
  events.filter(e=>e.ts<=untilTs).slice().sort((a,b)=>a.ts-b.ts).forEach(e=>{
    const id = e.phoneId;
    if(!id) return;
    if(!st[id]) st[id] = {model:e.model, description:e.description, place:null};
    if(e.model) st[id].model = e.model;
    if(e.description !== undefined && e.description !== null) st[id].description = e.description;
    switch(e.type){
      case 'received':    st[id].place = 'stock'; break;
      case 'sold':        st[id].place = 'sold'; break;
      case 'returned':    st[id].place = e.toFaulty ? 'faulty' : 'stock'; break;
      case 'repaired':    st[id].place = 'stock'; break;
      case 'written_off': st[id].place = 'off'; break;
      case 'undo_sale':   st[id].place = 'stock'; break;
      case 'undo_return': st[id].place = 'sold'; break;
      case 'deleted':     st[id].place = 'gone'; break;
    }
  });
  return st;
}
function countPlace(st, place){
  const m = {};
  Object.keys(st).forEach(id=>{
    const x = st[id];
    if(x.place === place){
      const k = (x.model||'Unknown') + (x.description ? ' - ' + x.description : '');
      m[k] = (m[k]||0) + 1;
    }
  });
  return m;
}
function totalOf(m){ return Object.keys(m).reduce((a,k)=>a+m[k],0); }
function buildStockSheet(shopId, date){
  const events = buildTransactionsForShop(shopId);
  const sTs = startOfDayTs(date), eTs = endOfDayTs(date);
  const openState = replayState(events, sTs - 1);
  const closeState = replayState(events, eTs);
  const open = countPlace(openState, 'stock');
  const close = countPlace(closeState, 'stock');
  const dayEvents = events.filter(e=>e.ts>=sTs && e.ts<=eTs);
  const salesQty={}, salesAmt={}, recv={}, retStock={}, retFaulty={}, rep={}, off={};
  dayEvents.forEach(e=>{
    const k = sheetKey(e);
    if(e.type==='sold'){ salesQty[k]=(salesQty[k]||0)+1; salesAmt[k]=(salesAmt[k]||0)+(e.price||0); }
    else if(e.type==='undo_sale'){ salesQty[k]=(salesQty[k]||0)-1; salesAmt[k]=(salesAmt[k]||0)-(e.price||0); }
    else if(e.type==='received'){ recv[k]=(recv[k]||0)+1; }
    else if(e.type==='returned'){ if(e.toFaulty) retFaulty[k]=(retFaulty[k]||0)+1; else retStock[k]=(retStock[k]||0)+1; }
    else if(e.type==='repaired'){ rep[k]=(rep[k]||0)+1; }
    else if(e.type==='written_off'){ off[k]=(off[k]||0)+1; }
  });
  const seen = {};
  [open, close, salesQty, recv, retStock, retFaulty, rep, off].forEach(m=>Object.keys(m).forEach(k=>{ seen[k]=true; }));
  const rows = Object.keys(seen).sort().map(k=>{
    // Goods received has its own column. Comments carry only the movements that
    // would otherwise make opening + received - sales fail to equal closing.
    const notes = [];
    if(retStock[k]) notes.push('+' + retStock[k] + ' returned to stock');
    if(rep[k]) notes.push('+' + rep[k] + ' repaired');
    if(retFaulty[k]) notes.push('-' + retFaulty[k] + ' to faulty shelf');
    if(off[k]) notes.push('-' + off[k] + ' written off');
    return {model:k, opening:open[k]||0, received:recv[k]||0, sales:salesQty[k]||0, closing:close[k]||0, amount:salesAmt[k]||0, notes:notes.join(', ')};
  }).filter(r=> r.opening || r.closing || r.sales || r.received || r.notes);
  return {
    rows,
    totals: {
      opening:  rows.reduce((a,r)=>a+r.opening,0),
      received: rows.reduce((a,r)=>a+r.received,0),
      sales:    rows.reduce((a,r)=>a+r.sales,0),
      closing:  rows.reduce((a,r)=>a+r.closing,0),
      amount:   rows.reduce((a,r)=>a+r.amount,0)
    },
    faulty: {
      opening: totalOf(countPlace(openState,'faulty')),
      closing: totalOf(countPlace(closeState,'faulty')),
      added:   totalOf(retFaulty),
      repaired:totalOf(rep),
      written: totalOf(off)
    }
  };
}

let ADMIN_STAFF_CACHE = {};
async function loadAdminStaffList(shopId){
  if(!sb) return [];
  try{
    const { data, error } = await sb.from('staff').select('id,name,active').eq('shop_id', shopId).order('name');
    if(error) throw error;
    ADMIN_STAFF_CACHE[shopId] = data || [];
    SB_UNREACHABLE = false;
  }catch(e){
    ADMIN_STAFF_CACHE[shopId] = ADMIN_STAFF_CACHE[shopId] || [];
    SB_UNREACHABLE = true;
  }
  return ADMIN_STAFF_CACHE[shopId];
}
let SHOP_RESET_CACHE = {};
async function loadShopResetInfo(shopId){
  if(!sb) return null;
  try{
    const { data, error } = await sb.from('shop_resets').select('wiped_by,wiped_at').eq('shop_id', shopId).order('wiped_at',{ascending:false}).limit(1);
    if(error) throw error;
    SHOP_RESET_CACHE[shopId] = (data && data[0]) || null;
    SB_UNREACHABLE = false;
  }catch(e){
    SHOP_RESET_CACHE[shopId] = null;
  }
  return SHOP_RESET_CACHE[shopId];
}

function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

function attachWipeConfirmWatcher(name){
  const input = document.getElementById('wipeConfirmInput');
  const btn = document.getElementById('wipeConfirmBtn');
  if(!input || !btn) return;
  input.addEventListener('input', ()=>{
    const match = input.value.trim() === name;
    btn.style.opacity = match ? '1' : '.45';
    btn.style.pointerEvents = match ? 'auto' : 'none';
  });
}
async function confirmWipeShop(shopId, name){
  const input = document.getElementById('wipeConfirmInput');
  if(!input || input.value.trim() !== name) return;
  if(!await askConfirm('Really clear ALL data for '+name+'? There is no undo.', 'Yes, clear it permanently')) return;
  const res = await callRpc('admin_wipe_shop_data', {p_shop_id: shopId});
  if(!res.ok){
    const el = document.getElementById('wipeErr');
    if(el) el.innerHTML = '<div class="err">'+esc(res.error)+'</div>';
    return;
  }
  delete SHOP_RESET_CACHE[shopId];
  await refreshShopData(shopId);
  const c = res.data || {};
  await askAlert(name+' cleared: '+(c.phones||0)+' phone(s), '+(c.dailyLogs||0)+' day log(s), '+(c.businessDays||0)+' business day(s) removed.');
  go('ownerSettings', {settingsShop: shopId});
}

// Shared by every Settings action below: call the RPC, and on success reload
// SHOPS/MODEL_LIST from the database so the change shows up everywhere (the
// menu panel, the model picker, the shop picker) without a page reload.
async function settingsAction(rpcName, params){
  const res = await callRpc(rpcName, params);
  if(res.ok){ await loadShopsAndModels(); }
  else { await askAlert(res.error); }
  render();
  return res;
}

// The ledger is append-only: history survives even if a phone is re-sold,
// a sale is undone, or an entry is deleted.
function buildTransactionsForShop(shopId){
  const data = SHOP_CACHE[shopId] || emptyShopData();
  const events = [];
  const covered = new Set();
  (data.ledger||[]).forEach(l=>{
    covered.add((l.phoneId||'') + '|' + l.type);
    events.push(Object.assign({}, l, {shopId}));
  });
  // Records created before the ledger existed still show up.
  data.inventory.forEach(p=>{
    if(p.receivedTs && !covered.has(p.id+'|received')) events.push({type:'received', ts:p.receivedTs, model:p.model, description:p.description, imei:p.imei, shopId, phoneId:p.id});
    if(p.soldTs && !covered.has(p.id+'|sold')) events.push({type:'sold', ts:p.soldTs, model:p.model, description:p.description, imei:p.imei, price:p.salePrice, shopId, phoneId:p.id, belowPrice:p.belowPrice, shortfall:p.priceShortfall});
    if(p.returnedTs && !covered.has(p.id+'|returned')) events.push({type:'returned', ts:p.returnedTs, model:p.model, description:p.description, imei:p.imei, reason:p.returnReason, faultParts:p.faultParts, shopId, phoneId:p.id});
  });
  return events;
}
const CORE_TX_TYPES = ['sold','returned','received'];
const TX_LABELS = {sold:'Sold', returned:'Returned', received:'Received', repaired:'Repaired', written_off:'Written off',
  undo_sale:'Sale undone', undo_return:'Return undone', deleted:'Entry deleted', deleted_eod:'Day log deleted',
  price_set:'Prices set', cash_confirmed:'Cash confirmed', cash_adjustment:'Cash adjusted', eod:'End of day', reopen:'Day reopened',
  shop_added:'Shop added', shop_renamed:'Shop renamed', shop_closed:'Shop closed'};
function txChipClass(t){
  if(t==='sold') return 'chip-red';
  if(t==='received' || t==='repaired') return 'chip-green';
  return 'chip-gray';
}
function buildTransactions(shopKey){
  let events = [];
  if(shopKey==='all'){
    SHOPS.forEach(s=>{ events = events.concat(buildTransactionsForShop(s.id)); });
  } else {
    events = buildTransactionsForShop(shopKey);
  }
  events.sort((a,b)=>b.ts-a.ts);
  return events;
}
function typeLabel(t){ return TX_LABELS[t] || t; }

  data.inventory.forEach(p=>{
    if((p.costPrice===null || p.costPrice===undefined) && p.batchId){

  });
  return Object.values(map);
}

    <div class="stat-grid">
      <div class="stat ${closeVar===null?'':(closeVar===0?'flag-ok':'flag-bad')}"><div class="label">Stock at close (system)</div><div class="value">${bd.closingStock}</div></div>
      <div class="stat ${closeFaultyVar===null?'':(closeFaultyVar===0?'flag-ok':'flag-bad')}"><div class="label">Faulty at close (system)</div><div class="value">${bd.closingFaulty!==undefined&&bd.closingFaulty!==null?bd.closingFaulty:'-'}</div></div>
    </div>
    <div style="font-size:12px;color:var(--text-faint);margin-bottom:14px;">Closed by ${esc(bd.closedBy||'-')} at ${bd.closedAt?new Date(bd.closedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'-'}. This is the running count the shop carries into the next day - there is no opening stock to enter.</div>
    ${closeVar!==null && closeVar!==0 ? `<div class="alert-banner">On this day the shop counted ${closeVar>0?'+':''}${closeVar} against what the system had at close.</div>` : ''}
    ${closeFaultyVar!==null && closeFaultyVar!==0 ? `<div class="alert-banner">Faulty shelf was out by ${closeFaultyVar>0?'+':''}${closeFaultyVar} at close.</div>` : ''}
    ` : ''}
    ${isToday && st.variance!==null && st.variance!==0 ? `<div class="alert-banner">Stock mismatch of ${st.variance>0?'+':''}${st.variance} against the system count right now.</div>` : ''}
    ${log && log.resubmitted ? `<div class="section-flag">This end of day was submitted ${log.resubmitted+1} times. Last by ${esc(log.submittedBy||'-')}.</div>` : ''}
    ${st.belowCount>0 ? `<div class="section-flag">${st.belowCount} sale(s) below your set price on this date - ${money(st.belowShortfall)} short.</div>` : ''}
    <h2>Transactions on this date</h2>
    <div class="card">
      ${events.length===0 ? '<div class="empty">No transactions on this date.</div>' : events.map(e=>`
        <div class="activity-row">
          <div class="txt"><span class="chip ${e.type==='sold'?'chip-red':(e.type==='returned'?'chip-gray':'chip-green')}">${typeLabel(e.type)}</span> ${esc(e.model)}${e.description?' - '+esc(e.description):''} &middot; IMEI ${esc(e.imei)}${e.price?' &middot; '+money(e.price):''}${e.faultParts&&e.faultParts.length?' &middot; faults: '+esc(e.faultParts.join(', ')):''}</div>
          <div class="time">${new Date(e.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}
function setReportDate(val){ S.reportDate = val; render(); }

async function saveSettings(){
  const threshold = parseInt(document.getElementById('lowStockSet').value.trim());
  if(isNaN(threshold) || threshold<0){ document.getElementById('settingsErr').innerHTML = '<div class="err">Enter a valid low stock number.</div>'; return; }
  const ok = await saveLowStockThreshold(threshold);
  if(!ok){ document.getElementById('settingsErr').innerHTML = '<div class="err">'+esc(SAVE_ERROR)+'</div>'; return; }
  showSuccessThenGeneric('Settings updated.', 'ownerDash');
}
function showSuccessThenGeneric(msg, nextView){
  const app = document.getElementById('app');
  app.innerHTML = offlineBanner() + saveErrorBanner() + `
    ${topbar('Admin dashboard','',false)}
    <div class="content">
      <div class="success-box"><div class="check">&#10003;</div><div class="msg">${esc(msg)}</div></div>
      <button class="btn btn-primary btn-full-center" onclick="go('${nextView}')">Continue</button>
    </div>`;
}

async function init(){
  try{
    document.getElementById('app').innerHTML = `<div class="content"><p class="lead">Loading...</p></div>`;
    // Tests inject window.__SB_OVERRIDE__ before this script runs, so nothing
    // here ever needs the real internet or the owner's real data to be tested.
    if(window.__SB_OVERRIDE__){
      sb = window.__SB_OVERRIDE__;
    } else if(window.supabase && typeof window.supabase.createClient === 'function'){
      // Shop-floor phones must not carry a live admin session between visits -
      // a saved session is one tap from cost prices, profit and the wipe-shop
      // screen. The admin signs in fresh every time the app is opened; staff
      // PIN entry is unaffected since it never goes through Supabase Auth.
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
    } else {
      sb = null;
    }
    // persistSession:false means there is never a stored session to restore
    // here - the app always starts signed out, and the admin logs in fresh
    // through the login screen (see submitAdminLogin).
    await loadSettings();
    await loadShopsAndModels();
    render();
    startPolling();
  }catch(e){
    showFatal(e);
  }
}
window.addEventListener('error', function(ev){
  if(document.getElementById('app') && /Loading\.\.\./.test(document.getElementById('app').innerText||'')){
    showFatal(ev.error || ev.message);
  }
});
window.addEventListener('resize', function(){ updateTableFades(); });
init();
</script>
